<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Algo Trading Dashboard</title>
<style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#0f172a;color:#f8fafc;margin:0;padding:16px}.container{max-width:1000px;margin:auto}.card{background:#1e293b;border-radius:12px;padding:16px;margin-bottom:16px;border-left:4px solid #38bdf8}h1{font-size:24px;margin:0 0 4px}.muted{color:#94a3b8;font-size:12px}button,input{border:1px solid #475569;border-radius:7px;padding:10px;background:#0f172a;color:#fff}button{background:#0284c7;border:0;font-weight:bold;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls input{flex:1;min-width:120px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #334155;white-space:nowrap}.ok{color:#4ade80}.bad{color:#f87171}.status{margin-top:8px;font-size:12px;color:#94a3b8}.metric{font-size:25px;font-weight:bold;margin:10px 0}.paper-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(max-width:600px){.paper-grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="container">
<header><h1>Algo Trading Terminal</h1><div class="muted">Cash–Future Scanner • Paper Trading</div></header>
<section class="card">
<h3>Cash–Future Opportunities</h3>
<div class="controls"><input id="api" placeholder="Backend API URL"><button id="scanBtn" onclick="scan()">Run Scan</button></div>
<div id="scanStatus" class="status">Ready</div>
<div class="table-wrap"><table><thead><tr><th>Symbol</th><th>Cash</th><th>Future</th><th>Gap</th><th>Margin</th><th>Net Profit</th><th>ROI</th><th>Status</th></tr></thead><tbody id="rows"><tr><td colspan="8">No scan yet</td></tr></tbody></table></div>
</section>
<section class="card" style="border-left-color:#facc15">
<h3>Paper Trading</h3>
<p class="muted">Simulation only. No Angel One/live order is sent.</p>
<div class="paper-grid">
<input id="paperPrice" type="number" min="0.01" step="0.01" placeholder="Entry price">
<input id="paperQty" type="number" min="0.01" step="0.01" placeholder="Quantity">
<input id="slPct" type="number" min="0" step="0.1" value="2" placeholder="SL %">
<input id="targetPct" type="number" min="0" step="0.1" value="4" placeholder="Target %">
<input id="paperExit" type="number" min="0.01" step="0.01" placeholder="Exit price">
</div>
<div class="controls" style="margin-top:10px"><button id="paperEntryBtn" style="flex:1" onclick="paperEntry()">Paper Entry</button><button id="paperPositionBtn" style="flex:1" onclick="paperPosition()">Check Position</button><button id="paperExitBtn" style="flex:1" onclick="paperExit()">Paper Exit</button></div>
<div id="paperStatus" class="status">No paper position</div>
<div id="paperResult" class="metric">—</div>
</section>
<section class="card" style="border-left-color:#a855f7"><h3>System</h3><div id="log" class="muted">Dashboard initialized.</div></section>
</div>
<script>
const apiInput=document.getElementById('api');apiInput.value=localStorage.getItem('algoApiBase')||'';
const paperButtons=['paperEntryBtn','paperPositionBtn','paperExitBtn'];
function base(){return apiInput.value.trim().replace(/\/$/,'')||window.location.origin}
function log(x){document.getElementById('log').textContent='['+new Date().toLocaleTimeString()+'] '+x}
function setPaperBusy(busy,message){paperButtons.forEach(id=>document.getElementById(id).disabled=busy);if(message)document.getElementById('paperStatus').textContent=message}
async function scan(){const status=document.getElementById('scanStatus'),rows=document.getElementById('rows'),button=document.getElementById('scanBtn');const b=base();localStorage.setItem('algoApiBase',apiInput.value.trim());button.disabled=true;button.textContent='SCANNING…';status.textContent='SCANNING BACKEND…';try{const r=await fetch(b+'/api/v1/scanner/cash-future/live/auto',{cache:'no-store'});if(!r.ok)throw new Error('Scanner API '+r.status);const p=await r.json();rows.innerHTML='';(p.data||[]).forEach(x=>{const tr=document.createElement('tr');tr.innerHTML='<td>'+x.symbol+'</td><td>'+num(x.cash_ltp)+'</td><td>'+num(x.future_ltp)+'</td><td>'+num(x.gap)+' ('+num(x.gap_pct)+'%)</td><td>'+num(x.margin_required)+'</td><td>'+num(x.net_profit)+'</td><td>'+num(x.roi_pct)+'%</td><td class="ok">EXECUTABLE</td>';rows.appendChild(tr)});if(!rows.children.length)rows.innerHTML='<tr><td colspan="8">No executable opportunities</td></tr>';status.textContent='SCAN COMPLETE • '+(p.opportunity_count||0)+' executable opportunities';log('Cash–Future scan completed');}catch(e){status.textContent='SCAN FAILED: '+e.message;rows.innerHTML='<tr><td colspan="8">No backend data — no demo data shown.</td></tr>';log('Scan failed: '+e.message)}finally{button.disabled=false;button.textContent='RUN SCAN'}}
function num(v){return Number(v||0).toFixed(2)}
async function paperEntry(){const status=document.getElementById('paperStatus'),result=document.getElementById('paperResult');const price=Number(document.getElementById('paperPrice').value),quantity=Number(document.getElementById('paperQty').value);if(!(price>0&&quantity>0)){status.textContent='Enter valid price and quantity.';return}const body={price,quantity,stop_loss_pct:Number(document.getElementById('slPct').value)/100,target_pct:Number(document.getElementById('targetPct').value)/100};setPaperBusy(true,'PAPER ENTRY IN PROGRESS…');try{const r=await fetch(base()+'/api/v1/execution/paper/entry',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});if(!r.ok)throw new Error('Paper API '+r.status);const p=await r.json();result.textContent='Entry ₹'+num(p.entry_price)+' • SL ₹'+num(p.stop_loss)+' • Target ₹'+num(p.target);status.innerHTML='<span class="ok">PAPER POSITION ACTIVE</span> • Qty '+num(p.fill.quantity);log('Paper entry accepted');}catch(e){status.textContent='Paper execution failed: '+e.message;log('Paper entry failed: '+e.message)}finally{setPaperBusy(false)}}
async function paperPosition(){const status=document.getElementById('paperStatus'),result=document.getElementById('paperResult');setPaperBusy(true,'CHECKING PAPER POSITION…');try{const r=await fetch(base()+'/api/v1/execution/paper/position',{cache:'no-store'});if(!r.ok)throw new Error('Paper position API '+r.status);const p=await r.json();if(!p.position){status.textContent='No active paper position.';result.textContent='—';log('Paper position check • FLAT');return}const position=p.position;status.innerHTML='<span class="ok">PAPER POSITION ACTIVE</span> • Qty '+num(position.quantity);result.textContent='Entry ₹'+num(position.entry_price)+' • SL ₹'+num(position.stop_loss)+' • Target ₹'+num(position.target);log('Paper position check • ACTIVE');}catch(e){status.textContent='Paper position check failed: '+e.message;log('Paper position check failed: '+e.message)}finally{setPaperBusy(false)}}
async function paperExit(){const status=document.getElementById('paperStatus'),result=document.getElementById('paperResult');const exit=Number(document.getElementById('paperExit').value);if(!(exit>0)){status.textContent='Enter a valid exit price.';return}setPaperBusy(true,'PAPER EXIT IN PROGRESS…');try{const r=await fetch(base()+'/api/v1/execution/paper/exit',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({price:exit})});if(!r.ok)throw new Error('Paper exit API '+r.status);const p=await r.json();if(p.status==='flat'){status.textContent='No active paper position.';result.textContent='—';log('Paper exit ignored • no active position');return}const cls=Number(p.pnl)>=0?'ok':'bad';result.innerHTML='P&L <span class="'+cls+'">₹'+num(p.pnl)+'</span>';status.innerHTML='<span class="ok">PAPER POSITION CLOSED</span>';log('Paper exit accepted • P&L ₹'+num(p.pnl));}catch(e){status.textContent='Paper exit failed: '+e.message;log('Paper exit failed: '+e.message)}finally{setPaperBusy(false)}}
scan();
</script>
</body>
</html>
