<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Broker Settings</title><style>body{margin:0;background:#07111f;color:#e8eef7;font:15px system-ui,Arial}main{max-width:760px;margin:40px auto;padding:24px}section{background:#101d2e;border:1px solid #24364d;border-radius:16px;padding:24px}input{width:100%;box-sizing:border-box;margin:7px 0 12px;padding:12px;border-radius:9px;border:1px solid #31445c;background:#0a1524;color:#fff}button{padding:12px 18px;border:0;border-radius:9px;cursor:pointer;margin-right:8px}#connect{background:#19c37d;color:#03150e}#disconnect{background:#26384e;color:#fff}.status{margin:14px 0;padding:12px;border-radius:9px;background:#0a1524}.off{color:#ffb86b}</style></head><body><main><section><h1>Broker Settings</h1><p>Angel One connection</p><div id="status" class="status">Checking connection…</div><label>API Key</label><input id="apiKey" type="password" autocomplete="off"><label>Client Code</label><input id="clientCode" autocomplete="off"><label>Password</label><input id="password" type="password" autocomplete="off"><label>TOTP Secret</label><input id="totpSecret" type="password" autocomplete="off"><button id="connect">Connect Angel One</button><button id="disconnect">Disconnect</button><p class="off"><b>Real Trading: OFF</b> — connecting a broker does not enable live orders.</p></section></main><script>const base=localStorage.getItem('apiBaseUrl')||location.origin;const token=localStorage.getItem('authToken')||'';const h={'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})};async function status(){try{const r=await fetch(base+'/api/v1/brokers/angel_one/status',{headers:h});const x=await r.json();document.getElementById('status').textContent=x.connected?'● Connected — Angel One':'○ Not connected — Angel One'}catch(e){document.getElementById('status').textContent='Connection check failed'}}document.getElementById('connect').onclick=async()=>{const body={broker:'angel_one',api_key:apiKey.value,client_code:clientCode.value,password:password.value,totp_secret:totpSecret.value};try{const r=await fetch(base+'/api/v1/brokers/connect',{method:'POST',headers:h,body:JSON.stringify(body)});const x=await r.json();if(!r.ok)throw new Error(x.detail||'Connect failed');apiKey.value=password.value=totpSecret.value='';document.getElementById('status').textContent='● Connected — Angel One';alert('Broker connected. Real Trading remains OFF.')}catch(e){alert(e.message)}};document.getElementById('disconnect').onclick=async()=>{await fetch(base+'/api/v1/brokers/angel_one',{method:'DELETE',headers:h});status()};status();</script></body></html>
