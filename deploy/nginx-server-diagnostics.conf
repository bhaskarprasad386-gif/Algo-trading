# Public read-only diagnostics route inside the EXISTING HTTPS server block.
# Dashboard access remains unchanged (no login is added).
# The collector itself still binds only to 127.0.0.1; do not expose port 8765 directly.
# Error events are intentionally publicly viewable; the collector redacts credential
# and account-secret fields before persistence and response.
location ^~ /server-diagnostics/ {
    proxy_pass http://127.0.0.1:8765/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    proxy_send_timeout 5s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}
