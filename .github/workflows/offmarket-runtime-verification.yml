name: Off-Market Runtime Verification

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/offmarket-runtime-verification.yml'
      - 'backend/tests/test_off_market_runtime_verification.py'
      - 'backend/app/market_data/common_strategy_feed.py'
      - 'backend/app/market_data/live_box_spread_runner.py'
      - 'backend/app/scanner/butterfly_condor_shadow.py'
  schedule:
    # 18:45 IST on weekdays: after the NSE/BSE cash and derivatives session.
    - cron: "15 13 * * 1-5"

permissions:
  contents: read

concurrency:
  group: offmarket-runtime-verification
  cancel-in-progress: false

jobs:
  verify-vps-runtime:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify off-market VPS runtime (read-only)
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_KEY"
          test -n "$VPS_USER"
          test -n "$VPS_HOST"
          printf '%s' "$VPS_KEY" | base64 --decode > /tmp/vps_key
          chmod 600 /tmp/vps_key
          mkdir -p ~/.ssh
          keyscan_ok=0
          for attempt in 1 2 3; do
            if timeout 10 ssh-keyscan -T 8 -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/tmp/offmarket-keyscan.err; then
              keyscan_ok=1
              break
            fi
            sleep 3
          done
          test "$keyscan_ok" -eq 1

          REMOTE_SCRIPT=$(cat <<'REMOTE'
          set -euo pipefail
          cd /opt/Algo-Trading

          echo "=== OFF-MARKET RUNTIME VERIFICATION ==="
          echo "COMMIT=$(git rev-parse --short HEAD)"
          test "$(systemctl is-active algo-trading.service)" = "active"
          echo "SERVICE=PASS"

          curl -fsS --connect-timeout 2 --max-time 8 http://127.0.0.1:8000/health -o /tmp/offmarket-health.json
          curl -fsS --connect-timeout 2 --max-time 8 http://127.0.0.1:8000/api/v1/market-data/live-health -o /tmp/offmarket-live-health.json
          curl -fsS --connect-timeout 2 --max-time 8 http://127.0.0.1:8000/api/v1/market-data/common-feed-health -o /tmp/offmarket-common-feed.json
          curl -fsS --connect-timeout 2 --max-time 8 http://127.0.0.1:8000/api/v1/scanner/box-spread/live -o /tmp/offmarket-box-live.json
          curl -fsS --connect-timeout 2 --max-time 8 http://127.0.0.1:8000/api/v1/scanner/box-spread/diagnostics -o /tmp/offmarket-box-diagnostics.json
          curl -fsS --connect-timeout 2 --max-time 8 http://127.0.0.1:8000/api/v1/market-data/shoonya-health -o /tmp/offmarket-shoonya.json

          python3 - <<'PY'
          import json
          from pathlib import Path

          def load(name):
              return json.loads(Path(f"/tmp/offmarket-{name}.json").read_text())

          health = load("health")
          live = load("live-health")
          common = load("common-feed")
          box_live = load("box-live")
          box_diag = load("box-diagnostics")
          shoonya = load("shoonya")

          assert health.get("status") == "ok", f"application health is not ok: {health}"
          print("API_HEALTH=PASS")

          session = str(live.get("market_session") or "").upper()
          assert session == "CLOSED", f"probe ran in {session or 'UNKNOWN'} market session"
          assert str(live.get("live_orders") or "").upper() == "OFF", "live order safety is not OFF"
          print("MARKET_SESSION=CLOSED")
          print("LIVE_ORDER_SAFETY=OFF")

          feed = common.get("feed")
          assert common.get("initialized") is True, "common feed manager is not initialized"
          assert isinstance(feed, dict), "common-feed snapshot missing"
          for key in ("ticks_received", "active_instruments", "socket_groups", "delivery_errors"):
              value = feed.get(key)
              assert isinstance(value, (int, float)) and value >= 0, f"invalid common-feed counter {key}={value}"
          assert feed["active_instruments"] > 0, "common feed has no active instruments"
          assert feed["socket_groups"] > 0, "common feed has no socket groups"
          assert isinstance(feed.get("socket_health_by_group", {}), dict), "socket group health shape invalid"
          assert isinstance(feed.get("consumers", []), list), "consumer list shape invalid"
          print("COMMON_FEED_DIAGNOSTICS=PASS")
          print("COMMON_FEED_SUMMARY=" + json.dumps({
              "active_instruments": feed.get("active_instruments"),
              "socket_groups": feed.get("socket_groups"),
              "ticks_received": feed.get("ticks_received"),
              "delivery_errors": feed.get("delivery_errors"),
              "authentication": (feed.get("normalized_observer_authentication") or {}).get("state", "UNKNOWN"),
          }, sort_keys=True))

          assert box_live.get("strategy") == "box-spread", "Box live endpoint strategy mismatch"
          assert str(box_live.get("mode") or "").lower() == "paper-safe", "Box live endpoint is not paper-safe"
          assert isinstance(box_live.get("data"), list), "Box live data is not a list"
          assert box_diag.get("strategy") == "box-spread", "Box diagnostics strategy mismatch"
          assert str(box_diag.get("status") or "").lower() in {"available", "waiting"}, "Box diagnostics status invalid"
          assert isinstance(box_diag.get("counts", {}), dict), "Box diagnostic counters malformed"
          last_scan = box_diag.get("last_scan")
          assert last_scan is None or isinstance(last_scan, dict), "Box last_scan must be an object or null"
          print("BOX_ENDPOINT_CONTRACTS=PASS")
          print("BOX_OFFMARKET_STATE=" + str(box_diag.get("status", "UNKNOWN")).upper())
          print("BOX_LAST_SCAN=" + ("PRESENT" if last_scan else "NOT_YET_SCANNED"))

          assert shoonya.get("enabled") is False, "Shoonya is expected to remain disabled in this verification profile"
          assert shoonya.get("mode") == "shadow_only", "Shoonya mode must remain shadow_only"
          assert shoonya.get("order_routing_enabled") is False, "Shoonya order routing must remain disabled"
          assert shoonya.get("strategy_fanout_enabled") is False, "Shoonya strategy fanout must remain disabled"
          print("SHOONYA_ORDER_ROUTING=OFF")
          print("SHOONYA_STRATEGY_FANOUT=OFF")
          print("OFFMARKET_RUNTIME_RESULT=PASS")
          PY

          if git cat-file -e HEAD:backend/app/scanner/butterfly_condor_shadow.py 2>/dev/null; then
            PYTHONPATH=backend python3 - <<'PY'
          from time import time_ns
          from app.scanner.butterfly_condor_shadow import evaluate_butterfly_condor_snapshot

          result = evaluate_butterfly_condor_snapshot({
              "quotes": {"captured_at_ns": time_ns(), "groups": []},
              "depth": {"records": []},
          })
          assert result.get("source") == "box-spread-shared-snapshot"
          assert result.get("read_only") is True
          assert result.get("execution_mode") == "SHADOW_ONLY"
          assert result.get("order_routing_enabled") is False
          assert result.get("result_count") == 0
          print("BUTTERFLY_CONDOR_SHADOW_RUNTIME=PASS")
          print("BUTTERFLY_CONDOR_ORDER_ROUTING=OFF")
          PY
            echo "SHADOW_DEPLOYMENT_READINESS=MODULE_PRESENT"
          else
            echo "BUTTERFLY_CONDOR_SHADOW_RUNTIME=NOT_DEPLOYED"
            echo "SHADOW_DEPLOYMENT_READINESS=BLOCKED_MODULE_NOT_IN_DEPLOYED_CHECKOUT"
          fi

          if integrity="$(timeout 15s sqlite3 -batch -noheader backend/algo_trading.db "PRAGMA quick_check(1);" 2>&1)"; then
            if [[ "$integrity" != "ok" ]]; then
              printf 'SQLITE_QUICK_CHECK_FAILED result=%s\n' "$integrity" >&2
              exit 1
            fi
            echo "SQLITE_QUICK_CHECK=PASS"
          else
            sqlite_status=$?
            printf 'SQLITE_QUICK_CHECK_FAILED exit=%s detail=%s\n' "$sqlite_status" "$integrity" >&2
            exit "$sqlite_status"
          fi

          echo "=== RECENT SERVICE FAULTS (INFORMATIONAL) ==="
          if timeout 10s journalctl -u algo-trading.service --since "24 hours ago" -n 2000 --no-pager 2>/dev/null > /tmp/offmarket-service-faults.log; then
            grep -Ei 'error|exception|failed|timeout|429|sqlite|websocket' /tmp/offmarket-service-faults.log | tail -40 || true
            echo "RECENT_SERVICE_FAULTS=COLLECTED"
          else
            journal_status=$?
            echo "RECENT_SERVICE_FAULTS=SKIPPED exit=$journal_status"
          fi          REMOTE
          )
          if printf '%s\n' "$REMOTE_SCRIPT" | timeout 150 ssh -i /tmp/vps_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 "$VPS_USER@$VPS_HOST" 'timeout 120s bash -s'; then
            echo "VPS_REMOTE_VERIFY=PASS"
          else
            ssh_status=$?
            printf 'VPS_REMOTE_VERIFY=FAILED exit=%s; remote diagnostics were not replayed\n' "$ssh_status" >&2
            exit "$ssh_status"
          fi

  test-offmarket-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-timeout
      - name: Run off-market replay and Box readiness contracts
        working-directory: backend
        run: |
          PYTHONPATH=. pytest -q tests/test_off_market_runtime_verification.py app/market_data/tests/test_common_strategy_feed_warm_start.py
