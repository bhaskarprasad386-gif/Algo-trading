name: Disable Cash Future, Calendar Spread and Box Spread Collectors

on:
  workflow_dispatch:

permissions:
  contents: read

# Serialize with the existing VPS configuration/restart workflows.
concurrency:
  group: vps-service-mutation
  cancel-in-progress: false

jobs:
  disable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Disable three collectors and verify service
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY_B64"
          printf '%s' "$VPS_SSH_KEY_B64" | base64 --decode > /tmp/vps_key
          chmod 600 /tmp/vps_key
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh -i /tmp/vps_key -o IdentitiesOnly=yes -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_DIR=/opt/Algo-Trading
          ENV_FILE="$APP_DIR/backend/.env"
          cd "$APP_DIR"
          git fetch origin main
          git merge --ff-only origin/main
          test -f "$ENV_FILE"

          set_env_false() {
            local key="$1"
            if grep -q "^\${key}=" "$ENV_FILE"; then
              sed -i "s/^\${key}=.*/\${key}=false/" "$ENV_FILE"
            else
              printf '\\n%s=false\\n' "$key" >> "$ENV_FILE"
            fi
          }

          # Only these strategy-specific flags are changed. The shared feed and
          # Synthetic Arbitrage flag are intentionally left untouched.
          set_env_false LIVE_CASH_FUTURE_DATA_ENABLED
          set_env_false LIVE_CALENDAR_SPREAD_DATA_ENABLED
          set_env_false LIVE_BOX_SPREAD_DATA_ENABLED

          systemctl restart algo-trading.service
          sleep 3
          systemctl is-active --quiet algo-trading.service

          for key in LIVE_CASH_FUTURE_DATA_ENABLED LIVE_CALENDAR_SPREAD_DATA_ENABLED LIVE_BOX_SPREAD_DATA_ENABLED; do
            grep -qx "\${key}=false" "$ENV_FILE"
            echo "\${key}=false"
          done
          echo "LIVE_SYNTHETIC_DATA_ENABLED=$(grep '^LIVE_SYNTHETIC_DATA_ENABLED=' "$ENV_FILE" | tail -n 1 | cut -d= -f2- || echo 'unset')"
          echo "SERVICE=active"
          echo "BROKER_ORDERS=unchanged (this workflow does not enable execution)"
          REMOTE
