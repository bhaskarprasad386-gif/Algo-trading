name: Fresh CI Verification

on:
  push:
    branches:
      - ci/fresh-verify-data-state
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install pytest
      - name: Compile backend
        run: python -m compileall -q app
      - name: Run tests
        run: python -m pytest -q
