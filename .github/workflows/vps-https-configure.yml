name: VPS HTTPS + Nginx Configure
# Endpoint repair run: keep Vercel HTTPS/WSS connectivity aligned with VPS.

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/vps-https-configure.yml
      - frontend/lib/config.ts
      - backend/app/main.py

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - name: Configure HTTPS endpoint on VPS
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          printf '%s' "$VPS_KEY" | base64 --decode > /tmp/vps_key
          chmod 600 /tmp/vps_key
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts

          ssh -i /tmp/vps_key -o IdentitiesOnly=yes -o BatchMode=yes "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          IP="82.41.67.22"
          APP_ROOT="/opt/Algo-trading/backend"
          ACME_ROOT="/var/www/acme"
          NGINX_SITE="/etc/nginx/sites-available/algo-trading"
          NGINX_LINK="/etc/nginx/sites-enabled/algo-trading"

          echo "== PRECHECK =="
          SERVICE_STATE="$(systemctl is-active algo-trading.service || true)"
          echo "SERVICE_STATE=$SERVICE_STATE"
          if [ "$SERVICE_STATE" != "active" ]; then
            echo "== SERVICE STATUS =="
            systemctl --no-pager --full status algo-trading.service || true
            echo "== RECENT JOURNAL =="
            journalctl -u algo-trading.service -n 80 --no-pager || true
            echo "== LISTEN PORT 8000 =="
            ss -lntp | grep ':8000 ' || true
          fi
          if ! curl -fsS --max-time 10 http://127.0.0.1:8000/openapi.json >/dev/null; then
            echo "FASTAPI_LOCAL_FAILED"
            echo "== FASTAPI FAILURE DIAGNOSTICS =="
            echo "SERVICE_SHOW="
            systemctl show algo-trading.service --no-pager \
              -p ActiveState -p SubState -p Result -p NRestarts \
              -p ExecMainPID -p ExecMainStatus -p ActiveEnterTimestamp \
              -p InactiveEnterTimestamp -p MemoryCurrent -p MemoryPeak \
              -p OOMPolicy -p MemoryHigh -p MemoryMax || true
            pid="$(systemctl show -p MainPID --value algo-trading.service 2>/dev/null || true)"
            if [ -n "$pid" ] && [ "$pid" != "0" ] && [ -r "/proc/$pid/status" ]; then
              echo "MAIN_PID=$pid"
              grep -E '^(Name|State|VmRSS|VmHWM|VmSize|Threads):' "/proc/$pid/status" || true
            fi
            echo "LISTEN_8000="
            ss -lntp | grep ':8000 ' || true
            echo "MEMORY="
            free -h || true
            echo "KERNEL_OOM="
            journalctl -k --no-pager -b 2>/dev/null |
              grep -Ei 'oom|out of memory|killed process|memory cgroup|systemd-oomd' |
              tail -40 || true
            echo "SERVICE_TRANSACTIONS="
            journalctl -u algo-trading.service --since "3 hours ago" --no-pager 2>/dev/null |
              grep -E 'Stopping|Stopped|Started|Starting|timeout|Failed|Main process exited|Killing|signal' |
              tail -120 || true
            echo "RECENT_SERVICE_LOG="
            journalctl -u algo-trading.service --since "30 minutes ago" --no-pager 2>/dev/null |
              tail -160 || true
            exit 1
          fi
          echo "FASTAPI_LOCAL_OK"

          if ! command -v certbot >/dev/null 2>&1 || ! certbot --version 2>&1 | awk '{print $2}' | awk -F. '{exit !($1 > 5 || ($1 == 5 && $2 >= 4))}'; then
            echo "INSTALLING_CERTBOT"
            python3 -m venv /opt/certbot
            /opt/certbot/bin/pip install --upgrade pip certbot >/dev/null
            ln -sf /opt/certbot/bin/certbot /usr/local/bin/certbot
          fi
          certbot --version

          mkdir -p "$ACME_ROOT/.well-known/acme-challenge"
          chown -R www-data:www-data "$ACME_ROOT"

          if [ ! -f "${NGINX_SITE}.pre-https-backup" ] && [ -f /etc/nginx/sites-enabled/default ]; then
            cp -a /etc/nginx/sites-enabled/default "${NGINX_SITE}.pre-https-backup"
          fi

          cat > "$NGINX_SITE" <<'NGINX'
          server {
              listen 80;
              listen [::]:80;
              server_name 82.41.67.22;

              location ^~ /.well-known/acme-challenge/ {
                  root /var/www/acme;
                  default_type text/plain;
              }

              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
              }
          }
          NGINX

          ln -sfn "$NGINX_SITE" "$NGINX_LINK"
          nginx -t
          systemctl reload nginx

          echo "NGINX_HTTP_PROXY_OK"
          HTTP_STATUS="$(curl -sS -H 'Host: 82.41.67.22' -o /tmp/nginx-openapi-body -w '%{http_code}' http://127.0.0.1/openapi.json || true)"
          echo "NGINX_OPENAPI_STATUS=$HTTP_STATUS"
          echo "NGINX_OPENAPI_HEADERS="
          curl -sSI -H 'Host: 82.41.67.22' http://127.0.0.1/openapi.json || true
          echo "NGINX_OPENAPI_BODY_HEAD="
          head -c 500 /tmp/nginx-openapi-body 2>/dev/null || true
          echo
          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "301" ]; then
            echo "== NGINX_ACTIVE_CONFIG_MATCHES =="
            nginx -T 2>&1 | grep -n -B 8 -A 30 'server_name 82.41.67.22' | head -n 240 || true
            echo "== LISTENERS =="
            ss -lntp | grep -E ':(80|443) ' || true
            exit 1
          fi
          echo "== ACME HTTP-01 PRECHECK =="
          ACME_TOKEN="algo-trading-acme-$(date +%s)"
          echo "$ACME_TOKEN" > "$ACME_ROOT/.well-known/acme-challenge/$ACME_TOKEN"
          chmod 644 "$ACME_ROOT/.well-known/acme-challenge/$ACME_TOKEN"
          echo "ACME_LOCAL=$(curl -sS -o - -w ' HTTP_STATUS=%{http_code}' -H 'Host: 82.41.67.22' http://127.0.0.1/.well-known/acme-challenge/$ACME_TOKEN || true)"
          if ! curl -fsS --max-time 15 "http://$IP/.well-known/acme-challenge/$ACME_TOKEN" | grep -Fxq "$ACME_TOKEN"; then
            echo "ACME_PUBLIC_HTTP_FAILED"
            rm -f "$ACME_ROOT/.well-known/acme-challenge/$ACME_TOKEN"
            exit 1
          fi
          echo "ACME_PUBLIC_HTTP_OK"
          rm -f "$ACME_ROOT/.well-known/acme-challenge/$ACME_TOKEN"

          echo "== CERTIFICATE =="
          if [ ! -f "/etc/letsencrypt/live/$IP/fullchain.pem" ]; then
            echo "REQUESTING_LETSENCRYPT_IP_CERT_STAGING"
            certbot certonly --staging --non-interactive --agree-tos --register-unsafely-without-email               --preferred-profile shortlived --webroot --webroot-path "$ACME_ROOT"               --ip-address "$IP" --verbose
            rm -rf "/etc/letsencrypt/live/$IP" "/etc/letsencrypt/archive/$IP" "/etc/letsencrypt/renewal/$IP.conf"
            echo "REQUESTING_LETSENCRYPT_IP_CERT_PRODUCTION"
            certbot certonly --non-interactive --agree-tos --register-unsafely-without-email               --preferred-profile shortlived --webroot --webroot-path "$ACME_ROOT"               --ip-address "$IP"
          else
            echo "EXISTING_CERT_FOUND"
            echo "RENEWING_EXISTING_CERTIFICATE"
            certbot renew --non-interactive --webroot --webroot-path "$ACME_ROOT" --deploy-hook "systemctl reload nginx"
            echo "CERTBOT_RENEW_COMPLETED"
          fi

          test -s "/etc/letsencrypt/live/$IP/fullchain.pem"
          test -s "/etc/letsencrypt/live/$IP/privkey.pem"

          cat > "$NGINX_SITE" <<'NGINX'
          server {
              listen 80;
              listen [::]:80;
              server_name 82.41.67.22;

              location ^~ /.well-known/acme-challenge/ {
                  root /var/www/acme;
                  default_type text/plain;
              }

              location / {
                  return 301 https://$host$request_uri;
              }
          }

          server {
              listen 443 ssl;
              listen [::]:443 ssl;
              server_name 82.41.67.22;

              ssl_certificate /etc/letsencrypt/live/82.41.67.22/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/82.41.67.22/privkey.pem;

              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_read_timeout 3600s;
                  proxy_send_timeout 3600s;
              }
          }
          NGINX

          nginx -t
          systemctl reload nginx

          mkdir -p /etc/letsencrypt/renewal-hooks/deploy
          cat > /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh <<'HOOK'
          #!/bin/sh
          systemctl reload nginx
          HOOK
          chmod 755 /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh

          echo "== FINAL CHECK =="
          echo "SERVICE=$(systemctl is-active algo-trading.service)"
          echo "HTTP=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1/openapi.json || true)"
          echo "HTTPS=$(curl -k -sS -o /dev/null -w '%{http_code}' https://127.0.0.1/openapi.json || true)"
          echo "CERT_SUBJECT=$(openssl x509 -in "/etc/letsencrypt/live/$IP/cert.pem" -noout -subject | sed 's/^subject=//')"
          echo "CERT_EXPIRES=$(openssl x509 -in "/etc/letsencrypt/live/$IP/cert.pem" -noout -enddate | sed 's/^notAfter=//')"
          echo "PORTS"
          ss -lntp | grep -E ':(80|443) ' || true
          echo "== WSS HANDSHAKE CHECK ==" 
          python3 - <<'PY'
          import socket
          import ssl
          import base64
          import os

          host = "82.41.67.22"
          key = base64.b64encode(os.urandom(16)).decode()
          request = (
              "GET /ws/dashboard HTTP/1.1\r\n"
              f"Host: {host}\r\n"
              "Upgrade: websocket\r\n"
              "Connection: Upgrade\r\n"
              f"Sec-WebSocket-Key: {key}\r\n"
              "Sec-WebSocket-Version: 13\r\n"
              "\r\n"
          )
          context = ssl._create_unverified_context()
          with socket.create_connection((host, 443), timeout=10) as raw:
              with context.wrap_socket(raw, server_hostname=host) as sock:
                  sock.sendall(request.encode())
                  response = b""
                  while b"\r\n\r\n" not in response and len(response) < 16384:
                      chunk = sock.recv(4096)
                      if not chunk:
                          break
                      response += chunk
          status_line = response.split(b"\r\n", 1)[0].decode("latin1", "replace")
          print(f"WSS_STATUS_LINE={status_line}")
          if not status_line.startswith("HTTP/1.1 101 "):
              raise SystemExit("WSS_HANDSHAKE_FAILED")
          print("WSS_HANDSHAKE_OK")
          PY
          REMOTE

          rm -f /tmp/vps_key
