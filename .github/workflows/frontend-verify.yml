name: Frontend Verify

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-verify.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-verify.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install dependencies
        run: npm install

      - name: Test WebSocket recovery state helpers
        run: npm run test:page-push-recovery

      - name: Verify requested scanner UI removals
        run: npm run test:scanner-ui-removal

      - name: Typecheck
        run: npm run typecheck

      - name: Build Next.js application
        run: npm run build:next

      - name: Build Cloudflare OpenNext Worker
        run: npm run build:cloudflare

      - name: Validate Wrangler Worker bundle (dry run)
        run: npx wrangler deploy --dry-run
