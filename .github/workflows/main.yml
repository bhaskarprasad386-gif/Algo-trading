name: Backend Verification

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify-backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python files
        run: |
          python -m compileall app

      - name: Verify FastAPI import
        env:
          ANGEL_API_KEY: ""
          ANGEL_CLIENT_ID: ""
          ANGEL_PASSWORD: ""
          ANGEL_TOTP_SECRET: ""
        run: |
          python -c "from app.main import app; print('FastAPI import: OK')"

      - name: Verify routes
        env:
          ANGEL_API_KEY: ""
          ANGEL_CLIENT_ID: ""
          ANGEL_PASSWORD: ""
          ANGEL_TOTP_SECRET: ""
        run: |
          python - <<'PY'
          from app.main import app

          routes = []

          for route in app.routes:
              path = getattr(route, "path", None)
              if path:
                  routes.append(path)

          print("Registered routes:")
          for path in routes:
              print(path)

          required = [
              "/health",
              "/api/v1/login",
              "/api/v1/market-data/ltp",
              "/api/v1/market-data/historical",
          ]

          missing = [path for path in required if path not in routes]

          if missing:
              print("MISSING ROUTES:", missing)
              raise SystemExit(1)

          print("Route verification: OK")
          PY
