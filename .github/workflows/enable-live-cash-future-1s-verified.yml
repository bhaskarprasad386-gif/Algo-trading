name: Enable Live Cash-Future 1s Collector (Verified VPS)

on:
  workflow_dispatch:

# Shared lock: serialize VPS service restarts/configuration.
concurrency:
  group: vps-service-mutation
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enable:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VPS_HOST: 82.41.67.22
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY_B64: ${{ secrets.VPS_SSH_KEY }}
    steps:
      - name: Enable collector and restart service
        shell: bash
        run: |
          set -euo pipefail
          test -n "$VPS_USER"
          test -n "$VPS_SSH_KEY_B64"
          printf '%s' "$VPS_SSH_KEY_B64" | base64 --decode > /tmp/vps_key
          chmod 600 /tmp/vps_key
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i /tmp/vps_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          APP_DIR=/opt/Algo-Trading
          ENV_FILE="$APP_DIR/backend/.env"

          test -d "$APP_DIR/.git"
          cd "$APP_DIR"
          git fetch origin main
          git merge --ff-only origin/main
          test -f "$ENV_FILE"

          if grep -q '^LIVE_CASH_FUTURE_DATA_ENABLED=' "$ENV_FILE"; then
            sed -i 's/^LIVE_CASH_FUTURE_DATA_ENABLED=.*/LIVE_CASH_FUTURE_DATA_ENABLED=true/' "$ENV_FILE"
          else
            printf '\nLIVE_CASH_FUTURE_DATA_ENABLED=true\n' >> "$ENV_FILE"
          fi

          systemctl restart algo-trading.service
          sleep 3
          systemctl is-active --quiet algo-trading.service

          echo "=== RESULT ==="
          echo "LIVE_CASH_FUTURE_DATA_ENABLED=true"
          echo "LIVE_TRADING=OFF"
          echo "SERVICE=active"
          echo "COMMIT=$(git rev-parse --short HEAD)"
          REMOTE