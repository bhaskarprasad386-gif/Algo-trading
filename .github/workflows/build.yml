name: Build and Verify

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install pytest
      - name: Compile backend
        working-directory: backend
        run: python -m compileall -q app
      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

# Android build is intentionally deferred.
# It will be re-enabled after the Android Gradle project is independently fixed and tested.
