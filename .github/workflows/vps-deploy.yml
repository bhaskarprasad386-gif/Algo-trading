name: VPS Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "35 15 * * 1-5"
      timezone: "Asia/Kolkata"

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy main to VPS
        env:
          VPS_KEY_B64: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          printf '%s' "$VPS_KEY_B64" | base64 --decode > /tmp/vps_key
          chmod 600 /tmp/vps_key
          ssh-keygen -y -f /tmp/vps_key > /tmp/vps_pub
          mkdir -p ~/.ssh
          printf 'SSH_KEY_OK\n'
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts || true
          printf 'SSH_KEYSCAN_DONE\n'
          ssh -i /tmp/vps_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$VPS_USER@$VPS_HOST" 'printf "SSH_AUTH_OK\\n"'
          ssh -i /tmp/vps_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$VPS_USER@$VPS_HOST" 'set -Eeuo pipefail; APP_DIR="/opt/Algo-Trading"; if [[ ! -d "$APP_DIR/.git" ]]; then rm -rf "$APP_DIR"; git clone --branch main --single-branch https://github.com/bhaskarprasad386-gif/Algo-trading.git "$APP_DIR"; fi; cd "$APP_DIR"; git fetch origin main; git merge --ff-only origin/main; IST_HHMM="$(TZ=Asia/Kolkata date +%H%M)"; IST_HHMM_NUM=$((10#$IST_HHMM)); IST_DOW="$(TZ=Asia/Kolkata date +%u)"; if [[ "$IST_DOW" -le 5 && "$IST_HHMM_NUM" -ge 915 && "$IST_HHMM_NUM" -lt 1530 ]]; then printf "DEPLOY_DEFERRED_MARKET_HOURS=IST_%s\\n" "$IST_HHMM"; else printf "RUNTIME_BEFORE_RESTART=\\n"; curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/market-data/runtime/health || true; printf "SERVICE_MEMORY_BEFORE_RESTART=\\n"; systemctl show algo-trading.service -p MainPID -p MemoryCurrent -p MemoryPeak -p NRestarts -p ActiveState -p SubState || true; bash deploy/bootstrap-vps.sh; fi; printf "DEPLOY_COMMIT="; git rev-parse --short HEAD; printf "SERVICE="; systemctl is-active algo-trading.service; printf "HEALTH="; curl --fail --silent --show-error http://127.0.0.1:8000/health; printf "LIVE_DATA_HEALTH="; curl --fail --silent --show-error http://127.0.0.1:8000/api/v1/market-data/live-health; printf "\\n"; cd "$APP_DIR/backend"; "$APP_DIR/.venv/bin/python" -c "from pathlib import Path; import sqlite3; from app.core.config import settings; db=Path(settings.BACKTEST_DATA_DB); db=db if db.is_absolute() else Path.cwd()/db; print(f\"LIVE_DATA_DB={db}\"); print(f\"LIVE_DATA_DB_EXISTS={db.is_file()}\"); conn=sqlite3.connect(db) if db.is_file() else None; row=conn.execute(\"SELECT COUNT(*), COUNT(DISTINCT instrument), MIN(timestamp_ns), MAX(timestamp_ns) FROM data_catalog WHERE source=? AND timeframe=?\",(\"angelone-live-1s\",\"1s\")).fetchone() if conn else (0,0,None,None); print(f\"LIVE_1S_ROWS={row[0]}\"); print(f\"LIVE_1S_INSTRUMENTS={row[1]}\"); print(f\"LIVE_1S_MIN_TIMESTAMP_NS={row[2]}\"); print(f\"LIVE_1S_MAX_TIMESTAMP_NS={row[3]}\"); conn.close() if conn else None"; printf "\\n"; printf "BOOT_HISTORY=\\n"; journalctl --list-boots --no-pager || true; printf "REBOOT_SHUTDOWN_HISTORY=\\n"; last -x -n 30 2>/dev/null || true; printf "SYSTEMD_BOOT_ANALYSIS=\\n"; systemd-analyze || true; printf "RECENT_BOOT_EVENTS=\\n"; journalctl --list-boots --no-pager | tail -10 || true; printf "\\n"; printf "SERVER_DIAGNOSTICS=\\n"; uptime; printf "MEMORY=\\n"; free -h; printf "SWAP=\\n"; swapon --show --bytes || true; printf "DISK=\\n"; df -h / /opt; printf "VMSTAT=\\n"; vmstat 1 2; printf "LOAD=\\n"; cat /proc/loadavg; printf "SERVICE_MEMORY=\\n"; systemctl show algo-trading.service -p MemoryCurrent -p MemoryPeak -p NRestarts -p ActiveState -p SubState -p OOMPolicy -p MemoryHigh -p MemoryMax; printf "KERNEL_MEMORY_EVENTS=\\n"; journalctl -k --no-pager -b | grep -Ei "oom|out of memory|killed process|memory cgroup|systemd-oomd" | tail -80 || true; printf "SYSTEMD_FAILURES=\\n"; systemctl --failed --no-pager || true; printf "PROCESS_TREE=\\n"; ps -eo pid,ppid,stat,etime,%cpu,%mem,rss,vsz,cmd --sort=-rss | head -40 || true; printf "SERVICE_CGROUP_PROCS=\\n"; systemctl status algo-trading.service --no-pager -l || true; printf "SERVICE_RECENT=\\n"; journalctl -u algo-trading.service --since "2 hours ago" --no-pager -n 160 || true'
