name: VPS Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "35 15 * * 1-5"
      timezone: "Asia/Kolkata"

concurrency:
  group: vps-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy main to VPS
        env:
          VPS_KEY_B64: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          printf '%s' "$VPS_KEY_B64" | base64 --decode > /tmp/vps_key
          chmod 600 /tmp/vps_key
          ssh-keygen -y -f /tmp/vps_key > /tmp/vps_pub
          mkdir -p ~/.ssh
          printf 'SSH_KEY_OK\n'
          ssh-keyscan -T 10 -H "$VPS_HOST" >> ~/.ssh/known_hosts || true
          printf 'SSH_KEYSCAN_DONE\n'
          ssh -i /tmp/vps_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$VPS_USER@$VPS_HOST" 'printf "SSH_AUTH_OK\\n"'
          ssh -i /tmp/vps_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=20 "$VPS_USER@$VPS_HOST" 'set -Eeuo pipefail; APP_DIR="/opt/Algo-Trading"; if [[ ! -d "$APP_DIR/.git" ]]; then rm -rf "$APP_DIR"; git clone --branch main --single-branch https://github.com/bhaskarprasad386-gif/Algo-trading.git "$APP_DIR"; fi; cd "$APP_DIR"; printf "PRE_FETCH_DISK=\n"; df -h / /opt || true; printf "PRE_FETCH_DISK_USAGE_TOP_LEVEL=\n"; du -xhd1 / 2>/dev/null | sort -h || true; printf "PRE_FETCH_DISK_USAGE_APP=\n"; du -xhd2 /opt/Algo-Trading/backend 2>/dev/null | sort -h | tail -80 || true; printf "PRE_FETCH_LARGEST_FILES=\n"; find /opt/Algo-Trading/backend /var/log /var/lib /tmp -xdev -type f -printf "%s %p\\n" 2>/dev/null | sort -nr | head -80 || true; printf "PRE_FETCH_LIVE_DB_FILES=\n"; ls -lhS /opt/Algo-Trading/backend/backtest_market_data* 2>/dev/null || true; printf "PRE_FETCH_GIT=\n"; du -sh /opt/Algo-Trading/.git 2>/dev/null || true; printf "PRE_FETCH_JOURNAL=\n"; journalctl --disk-usage 2>/dev/null || true; printf "EMERGENCY_SAFE_DISK_RECOVERY=\n"; journalctl --vacuum-size=128M || true; apt-get clean || true; printf "REMOVE_UNUSED_MARKET_DATA=\n"; rm -f /opt/Algo-Trading/backend/backtest_market_data.sqlite3 /opt/Algo-Trading/backend/backtest_market_data.sqlite3-wal /opt/Algo-Trading/backend/backtest_market_data.sqlite3-shm /opt/Algo-Trading/backend/backtest_market_data_*.sqlite3 /opt/Algo-Trading/backend/backtest_market_data_*.sqlite3-wal /opt/Algo-Trading/backend/backtest_market_data_*.sqlite3-shm; df -h / /opt; git fetch origin main; PRE_DEPLOY_COMMIT="$(git rev-parse HEAD)"; git merge --ff-only origin/main; printf "DEPLOYED_COMMIT=%s\\n" "$(git rev-parse HEAD)"; CHANGED_FILES="$(git diff --name-only "$PRE_DEPLOY_COMMIT" HEAD || true)"; printf "CHANGED_FILES_SINCE_PRE_DEPLOY=\\n%s\\n" "$CHANGED_FILES"; RUNTIME_CHANGE=false; while IFS= read -r changed; do case "$changed" in backend/*|deploy/algo-trading.service|deploy/bootstrap-vps.sh) RUNTIME_CHANGE=true; break;; esac; done <<< "$CHANGED_FILES"; printf "RUNTIME_CHANGE=%s\\n" "$RUNTIME_CHANGE"; IST_HHMM="$(TZ=Asia/Kolkata date +%H%M)"; IST_HHMM_NUM=$((10#$IST_HHMM)); IST_DOW="$(TZ=Asia/Kolkata date +%u)"; if [[ "$IST_DOW" -le 5 && "$IST_HHMM_NUM" -ge 915 && "$IST_HHMM_NUM" -lt 1530 ]]; then printf "DEPLOY_DEFERRED_MARKET_HOURS=IST_%s\n" "$IST_HHMM"; elif [[ "$RUNTIME_CHANGE" != "true" ]]; then printf "DEPLOY_NO_RUNTIME_CHANGE_NO_RESTART=true\n"; else printf "RUNTIME_BEFORE_RESTART=\n"; curl --fail --silent --show-error --connect-timeout 2 --max-time 8 http://127.0.0.1:8000/api/v1/market-data/runtime/health || true; printf "SERVICE_MEMORY_BEFORE_RESTART=\n"; systemctl show algo-trading.service -p MainPID -p MemoryCurrent -p MemoryPeak -p NRestarts -p ActiveState -p SubState || true; bash deploy/bootstrap-vps.sh; fi; printf "DEPLOY_COMMIT="; git rev-parse --short HEAD; printf "SERVICE="; systemctl is-active algo-trading.service; printf "HEALTH_RETRY=\n"; for attempt in $(seq 1 12); do if curl --fail --silent --show-error --connect-timeout 2 --max-time 8 http://127.0.0.1:8000/health; then break; fi; printf "HEALTH_RETRY_ATTEMPT=%s\n" "$attempt"; sleep 2; done; printf "LIVE_DATA_HEALTH_RETRY=\n"; for attempt in $(seq 1 12); do if curl --fail --silent --show-error --connect-timeout 2 --max-time 8 http://127.0.0.1:8000/api/v1/market-data/live-health; then break; fi; printf "LIVE_DATA_HEALTH_RETRY_ATTEMPT=%s\n" "$attempt"; sleep 2; done; printf "\n"; cd "$APP_DIR/backend"; "$APP_DIR/.venv/bin/python" -c "from pathlib import Path; import sqlite3; from app.core.config import settings; db=Path(settings.BACKTEST_DATA_DB); db=db if db.is_absolute() else Path.cwd()/db; print(f\"LIVE_DATA_DB={db}\"); print(f\"LIVE_DATA_DB_EXISTS={db.is_file()}\"); conn=sqlite3.connect(db) if db.is_file() else None; row=conn.execute(\"SELECT COUNT(*), COUNT(DISTINCT instrument), MIN(timestamp_ns), MAX(timestamp_ns) FROM data_catalog WHERE source=? AND timeframe=?\",(\"angelone-live-1s\",\"1s\")).fetchone() if conn else (0,0,None,None); print(f\"LIVE_1S_ROWS={row[0]}\"); print(f\"LIVE_1S_INSTRUMENTS={row[1]}\"); print(f\"LIVE_1S_MIN_TIMESTAMP_NS={row[2]}\"); print(f\"LIVE_1S_MAX_TIMESTAMP_NS={row[3]}\"); conn.close() if conn else None"; printf "\\n"; printf "BOOT_HISTORY=\\n"; journalctl --list-boots --no-pager || true; printf "REBOOT_SHUTDOWN_HISTORY=\\n"; last -x -n 30 2>/dev/null || true; printf "SYSTEMD_BOOT_ANALYSIS=\\n"; systemd-analyze || true; printf "RECENT_BOOT_EVENTS=\\n"; journalctl --list-boots --no-pager | tail -10 || true; printf "\\n"; printf "SERVER_DIAGNOSTICS=\\n"; uptime; printf "MEMORY=\\n"; free -h; printf "SWAP=\\n"; swapon --show --bytes || true; printf "DISK=\\n"; df -h / /opt; printf "DISK_USAGE_TOP_LEVEL=\\n"; du -xhd1 / 2>/dev/null | sort -h || true; printf "DISK_USAGE_APP=\\n"; du -xhd2 /opt/Algo-Trading/backend 2>/dev/null | sort -h | tail -80 || true; printf "DISK_LARGEST_FILES=\\n"; find /opt/Algo-Trading/backend /var/log /var/lib /tmp -xdev -type f -printf "%s %p\\\\n" 2>/dev/null | sort -nr | head -80 || true; printf "LIVE_DB_FILES=\\n"; ls -lhS /opt/Algo-Trading/backend/backtest_market_data* 2>/dev/null || true; printf "DISK_GIT=\\n"; du -sh /opt/Algo-Trading/.git 2>/dev/null || true; printf "DISK_JOURNAL=\\n"; journalctl --disk-usage 2>/dev/null || true; printf "VMSTAT=\\n"; vmstat 1 2; printf "LOAD=\\n"; cat /proc/loadavg; printf "SERVICE_MEMORY=\\n"; systemctl show algo-trading.service -p MemoryCurrent -p MemoryPeak -p NRestarts -p ActiveState -p SubState -p OOMPolicy -p MemoryHigh -p MemoryMax; printf "KERNEL_MEMORY_EVENTS=\\n"; journalctl -k --no-pager -b | grep -Ei "oom|out of memory|killed process|memory cgroup|systemd-oomd" | tail -80 || true; printf "SYSTEMD_FAILURES=\\n"; systemctl --failed --no-pager || true; printf "PROCESS_TREE=\\n"; ps -eo pid,ppid,stat,etime,%cpu,%mem,rss,vsz,cmd --sort=-rss | head -40 || true; printf "SERVICE_CGROUP_PROCS=\\n"; systemctl status algo-trading.service --no-pager -l || true; printf "SERVICE_RECENT=\\n"; journalctl -u algo-trading.service --since "2 hours ago" --no-pager -n 160 || true'
