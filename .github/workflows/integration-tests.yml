name: Integration Tests
on:
  push:
    branches: [main]
  pull_request:
    # Also validate stacked Box Spread PRs targeting the Batch 0 integration branch.
    branches: [main, feature/box-spread-manual-index-selection-batch-0]
  workflow_dispatch:

concurrency:
  group: integration-tests
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r backend/requirements.txt pytest pytest-timeout

      - name: Run integration and E2E tests
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          PYTHONPATH: backend
          DATABASE_URL: "sqlite:///:memory:"
          # Historical/backtesting tests exercise the subsystem explicitly in CI.
          # Production/default remains BACKTESTING_ENABLED=false.
          BACKTESTING_ENABLED: "true"
          # Integration tests must not start broker-backed live collectors.
          LIVE_CASH_FUTURE_DATA_ENABLED: "false"
          LIVE_CALENDAR_SPREAD_DATA_ENABLED: "false"
          LIVE_SYNTHETIC_DATA_ENABLED: "false"
          LIVE_BOX_SPREAD_DATA_ENABLED: "false"
          LIVE_MARKET_DATA_PERSISTENCE_ENABLED: "false"
          LIVE_CASH_FUTURE_DAILY_SHARDS_ENABLED: "false"
        run: >
          python -m pytest -q --tb=short -r fE
          --timeout=60 --timeout-method=thread --maxfail=100
          backend/app/market_data/tests/test_integration.py
          backend/tests/test_angelone_cash_future_batch_runner_integration.py
          backend/tests/test_universal_result_main_integration.py
          backend/tests/test_cash_future_strategy_db_route.py
          backend/tests/test_historical_arbitrage_catalog_e2e.py
          backend/tests/test_historical_catalog_replay.py
          backend/tests/test_historical_arbitrage_service.py
          backend/tests/test_angelone_cash_future_batch_runner.py

  common-feed-targeted:
    name: Common Feed Targeted Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile changed backend modules
        working-directory: backend
        run: |
          python -m py_compile app/market_data/common_websocket.py
          python -m py_compile app/market_data/common_strategy_feed.py
          python -m py_compile app/market_data/websocket.py

      - name: Run targeted common feed tests
        working-directory: backend
        env:
          PYTHONPATH: ..
        run: |
          python -m pytest -q \
            app/market_data/tests/test_common_websocket.py \
            app/market_data/tests/test_websocket.py \
            app/market_data/tests/test_batch_pq.py

  iv-independent-master-network:
    name: IV Independent Angel One Master Network Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies for production IV loader import
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt

      - name: Download and validate official master with production IV loader
        working-directory: backend
        env:
          PYTHONPATH: .
          IV_INSTRUMENT_MASTER_CACHE_PATH: ${{ runner.temp }}/iv_instrument_master_cache.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import requests
          from collections import Counter
          from app.scanner.iv_skew_flip.instruments import (
              PRIMARY_MASTER_URL, ALTERNATE_MASTER_URL, _validate_rows,
              _write_snapshot, _read_recent_snapshot,
          )

          for label, url in (("primary", PRIMARY_MASTER_URL), ("alternate", ALTERNATE_MASTER_URL)):
              try:
                  response = requests.get(url, timeout=(5, 30))
                  response.raise_for_status()
                  payload = response.json()
                  print(f"{label}_http_status={response.status_code}")
                  print(f"{label}_payload_type={type(payload).__name__}")
                  if not isinstance(payload, list):
                      print(f"{label}_payload_preview={str(payload)[:500]}")
                      continue
                  invalid = []
                  for index, row in enumerate(payload):
                      if not isinstance(row, dict):
                          invalid.append({"index": index, "kind": type(row).__name__})
                          continue
                      symbol, exchange, token = row.get("symbol"), row.get("exch_seg"), row.get("token")
                      reasons = []
                      if not isinstance(symbol, str) or not symbol.strip(): reasons.append("symbol")
                      if not isinstance(exchange, str) or not exchange.strip(): reasons.append("exch_seg")
                      if isinstance(token, bool) or token is None or not str(token).strip().isdigit() or int(token) <= 0: reasons.append("token")
                      if reasons:
                          invalid.append({"index": index, "reasons": reasons, "keys": sorted(row.keys()), "symbol": str(symbol)[:80], "exchange": str(exchange)[:30], "token": str(token)[:30]})
                  print(json.dumps({
                      "source": label,
                      "total_rows": len(payload),
                      "invalid_global_rows": len(invalid),
                      "invalid_reason_counts": dict(Counter(reason for item in invalid for reason in item.get("reasons", []))),
                      "invalid_samples": invalid[:8],
                      "sample_first_row": payload[0] if payload and isinstance(payload[0], dict) else str(payload[:1]),
                  }, indent=2, default=str))
                  try:
                      validated_rows = _validate_rows(payload)
                      print(f"{label}_production_validation=PASS")
                      # Persist using the exact production schema, digest and atomic writer.
                      _write_snapshot(validated_rows)
                      cached = _read_recent_snapshot()
                      if cached is None:
                          raise RuntimeError("production snapshot could not be read back with schema/digest/freshness checks")
                      print(f"{label}_snapshot_readback=PASS")
                      print(f"{label}_snapshot_rows={len(cached[0])}")
                  except Exception as exc:
                      print(f"{label}_production_validation=FAIL: {type(exc).__name__}: {exc}")
              except Exception as exc:
                  print(f"{label}_fetch_failed={type(exc).__name__}: {exc}")

          snapshot_path = Path(os.environ["IV_INSTRUMENT_MASTER_CACHE_PATH"])
          if not snapshot_path.is_file() or snapshot_path.stat().st_size == 0:
              raise SystemExit("No production-validated IV snapshot was generated; refusing to continue")

      - name: Upload validated IV-only snapshot for controlled transfer
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: iv-instrument-master-validated
          path: ${{ runner.temp }}/iv_instrument_master_cache.json
          if-no-files-found: error
          retention-days: 1

  box-master-shutdown-regression:
    name: Box Spread Master Shutdown and Cache Regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      PYTHONPATH: backend
      DATABASE_URL: "sqlite:///:memory:"
      BOX_SPREAD_INSTRUMENT_MASTER_CACHE_PATH: ${{ runner.temp }}/box-spread-test-cache.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-timeout
      - name: Compile changed modules
        run: |
          python -m py_compile backend/app/main.py
          python -m py_compile backend/app/core/daemon_worker.py
          python -m py_compile backend/app/market_data/box_spread_instrument_cache.py
          python -m py_compile backend/scripts/recover_box_spread_master_artifact.py
      - name: Run Box Spread cache and daemon cancellation regressions
        run: |
          python -m pytest -q --tb=short --timeout=30 --timeout-method=thread \
            backend/tests/test_box_spread_instrument_cache.py \
            backend/tests/test_daemon_worker.py

  instrument-master-transport:
    name: Instrument Master Transport Regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest
      - name: Compile shared instrument-master consumers
        run: |
          python -m py_compile backend/app/market_data/master_transport.py
          python -m py_compile backend/app/scanner/iv_skew_flip/instruments.py
          python -m py_compile backend/app/market_data/instruments.py
          python -m py_compile backend/tests/test_instrument_master_concurrency.py
          python -m py_compile backend/app/instruments/manager.py
          python -m py_compile backend/app/market_data/instruments.py
          python -m py_compile backend/app/scanner/iv_skew_flip/instruments.py
          python -m py_compile backend/scripts/recover_box_spread_master_artifact.py
          python -m py_compile backend/scripts/recover_iv_master_artifact.py
          python -m py_compile backend/scripts/recover_latest_master_artifacts.py
      - name: Run instrument-master regression suite
        run: |
          python -m pytest -q --tb=short \
            backend/tests/test_master_transport.py \
            backend/tests/test_instrument_master_concurrency.py \
            backend/tests/test_box_spread_instrument_cache.py \
            backend/tests/test_iv_skew_flip_instruments.py
