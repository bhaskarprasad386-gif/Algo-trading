name: Integration Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: integration-tests
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r backend/requirements.txt pytest pytest-timeout

      - name: Run integration and E2E tests
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          PYTHONPATH: backend
          DATABASE_URL: "sqlite:///:memory:"
          # Historical/backtesting tests exercise the subsystem explicitly in CI.
          # Production/default remains BACKTESTING_ENABLED=false.
          BACKTESTING_ENABLED: "true"
          # Integration tests must not start broker-backed live collectors.
          LIVE_CASH_FUTURE_DATA_ENABLED: "false"
          LIVE_CALENDAR_SPREAD_DATA_ENABLED: "false"
          LIVE_SYNTHETIC_DATA_ENABLED: "false"
          LIVE_BOX_SPREAD_DATA_ENABLED: "false"
          LIVE_MARKET_DATA_PERSISTENCE_ENABLED: "false"
          LIVE_CASH_FUTURE_DAILY_SHARDS_ENABLED: "false"
        run: >
          python -m pytest -q --tb=short -r fE
          --timeout=60 --timeout-method=thread --maxfail=100
          backend/app/market_data/tests/test_integration.py
          backend/tests/test_angelone_cash_future_batch_runner_integration.py
          backend/tests/test_universal_result_main_integration.py
          backend/tests/test_cash_future_strategy_db_route.py
          backend/tests/test_historical_arbitrage_catalog_e2e.py
          backend/tests/test_historical_catalog_replay.py
          backend/tests/test_historical_arbitrage_service.py
          backend/tests/test_angelone_cash_future_batch_runner.py

  common-feed-targeted:
    name: Common Feed Targeted Regression
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Compile changed backend modules
        working-directory: backend
        run: |
          python -m py_compile app/market_data/common_websocket.py
          python -m py_compile app/market_data/common_strategy_feed.py
          python -m py_compile app/market_data/websocket.py

      - name: Run targeted common feed tests
        working-directory: backend
        env:
          PYTHONPATH: ..
        run: |
          python -m pytest -q \
            app/market_data/tests/test_common_websocket.py \
            app/market_data/tests/test_websocket.py \
            app/market_data/tests/test_batch_pq.py
