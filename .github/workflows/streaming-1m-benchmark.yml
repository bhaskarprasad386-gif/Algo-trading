name: Streaming 1M Benchmark

on:
  workflow_dispatch:
    inputs:
      events:
        description: Number of events
        required: true
        default: "1000000"
      batch_size:
        description: Atomic batch size
        required: true
        default: "10000"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements.txt

      - name: Run streaming benchmark
        working-directory: backend
        run: python benchmarks/benchmark_1m_streaming.py --events "${{ inputs.events }}" --batch-size "${{ inputs.batch_size }}"
