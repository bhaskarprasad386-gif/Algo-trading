name: One-time expiry UI patch
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch expiry-day Top-10 row
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('mobile/android/app/src/main/java/com/algotrading/app/FullFnoBacktestActivity.kt')
          s = p.read_text()
          start = s.index('    private fun addMonthlyTop10Row(item: MonthlyGapTop10Item) {')
          end = s.index('\n    private fun loadMonthlySelectionIntoBuilder', start)
          new = '''    private fun addMonthlyTop10Row(item: MonthlyGapTop10Item) {
        val expiryDay = item.is_expiry_day
        val row = LinearLayout(this).apply {
            orientation = LinearLayout.HORIZONTAL
            gravity = Gravity.CENTER_VERTICAL
            setPadding(8, 6, 4, 6)
            if (expiryDay) setBackgroundColor(Color.rgb(70, 0, 0))
        }
        val details = TextView(this).apply {
            layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.WRAP_CONTENT, 1f)
            setTextColor(if (expiryDay) Color.RED else Color.WHITE)
            textSize = 11f
            text = buildString {
                if (expiryDay) append("🔴 EXPIRY DAY • NO TRADE\\n")
                append("#${item.rank}  ${item.symbol} • Lot ${"%.0f".format(item.lot_size)}\\n")
                append("Month Gap High ₹${"%.2f".format(item.month_gap_high)} • Gap×Lot ₹${"%.2f".format(item.gap_value)}\\n")
                append("Date ${item.gap_high_date} • Time ${item.gap_high_time}\\n")
                append("Cash ₹${"%.2f".format(item.cash_price_at_gap_high)} • Future ₹${"%.2f".format(item.future_price_at_gap_high)}\\n")
                append("Contract ${item.contract_month ?: "-"} • ${item.instrument_key ?: "-"}\\n")
                if (expiryDay) append("Historical ranking retained • execution disabled")
            }
        }
        val build = Button(this).apply {
            text = if (expiryDay) "NO TRADE" else "BUILD"
            textSize = 9f
            isEnabled = !expiryDay
            setOnClickListener { loadMonthlySelectionIntoBuilder(item) }
        }
        val graph = Button(this).apply {
            text = "GRAPH"
            textSize = 9f
            setOnClickListener { loadCashFutureReplay(item.gap_high_date, item.symbol, "1m", "CURRENT", item.contract_month, item.gap_high_timestamp) }
        }
        val nextGraph = Button(this).apply {
            text = "NEXT"
            textSize = 9f
            setOnClickListener { loadCashFutureReplay(item.gap_high_date, item.symbol, "1m", "NEAR", null, null) }
        }
        row.addView(details)
        row.addView(build, LinearLayout.LayoutParams(68, 44).apply { setMargins(2, 0, 2, 0) })
        row.addView(graph, LinearLayout.LayoutParams(70, 44).apply { setMargins(2, 0, 2, 0) })
        row.addView(nextGraph, LinearLayout.LayoutParams(66, 44))
        gapCalendarRows.addView(row)
    }'''
          p.write_text(s[:start] + new + s[end:])
          PY
      - name: Commit patch and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/one-time-expiry-ui-patch.yml
          git add mobile/android/app/src/main/java/com/algotrading/app/FullFnoBacktestActivity.kt
          git commit -m 'Highlight expiry-day Cash-Future top-10 rows'
          git push