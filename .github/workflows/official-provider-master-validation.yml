name: Official Provider Master Validation

on:
  push:
    branches:
      - feat/institutional-market-data-shoonya
    paths:
      - "backend/app/market_data/provider_master_*.py"
      - "backend/scripts/validate_official_provider_masters.py"
      - ".github/workflows/official-provider-master-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-official-masters:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install validation dependency
        run: python -m pip install -r requirements.txt
      - name: Download and validate official Angel One and Shoonya NFO masters
        working-directory: backend
        run: |
          python scripts/validate_official_provider_masters.py \
            --report ../official-provider-master-validation.json
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-provider-master-validation
          path: official-provider-master-validation.json
          if-no-files-found: ignore
          retention-days: 14
