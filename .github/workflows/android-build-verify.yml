name: Android Build Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  BACKEND_BASE_URL: https://algo-trading-backend-2.onrender.com/
  BACKEND_WS_URL: wss://algo-trading-backend-2.onrender.com

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Compile Android debug build
        # Build against the live Render backend, not the emulator-only 10.0.2.2 host.
        run: gradle assembleDebug --no-daemon -PbackendBaseUrl="$BACKEND_BASE_URL" -PbackendWsUrl="$BACKEND_WS_URL"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: algo-trading-debug-apk-verify
          path: mobile/android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
