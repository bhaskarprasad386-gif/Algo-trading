name: Apply batch 91-100 fixes

on:
  push:
    branches: [fix/batch-45-50]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/batch-45-50
      - name: Apply verified fixes
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              s = p.read_text()
              if s.count(old) < count:
                  raise SystemExit(f"pattern not found enough times in {path}: {old!r}")
              p.write_text(s.replace(old, new, count))

          # #91/#92: event engine must update marks on HOLD/NONE and reject duplicate identity.
          replace(
              "backend/app/backtesting/engine.py",
              '            if signal.action in {"HOLD", "NONE"}:\n                continue\n',
              '            if signal.action in {"HOLD", "NONE"}:\n                raw_price = record.payload.get(price_field)\n                if not _is_number(raw_price):\n                    raise ValueError(f"event payload must contain numeric {price_field!r} or signal price")\n                mark_price = float(raw_price)\n                if not isfinite(mark_price) or mark_price <= 0:\n                    raise ValueError("event mark price must be finite and positive")\n                last_price = mark_price\n                last_timestamp = record.timestamp_ns\n                if open_trade is not None:\n                    marked_capital = capital + (mark_price * (1.0 - self.config.slippage_rate) - open_trade[1]) * self.config.quantity\n                    peak_capital = max(peak_capital, capital)\n                    if marked_capital < peak_capital:\n                        max_drawdown = max(max_drawdown, (peak_capital - marked_capital) / peak_capital)\n                continue\n',
          )
          replace(
              "backend/app/backtesting/engine.py",
              '            if previous_key is not None and key < previous_key:\n',
              '            if previous_key is not None and key <= previous_key:\n',
          )
          replace(
              "backend/app/backtesting/engine.py",
              'raise ValueError("events must be ordered by timestamp_ns and sequence")',
              'raise ValueError("events must be strictly ordered by timestamp_ns and sequence; duplicate event identity is not allowed")',
          )

          # #93: multi-instrument event replay ordering must be deterministic and identity-safe.
          replace(
              "backend/app/backtesting/event_engine.py",
              'sequence_key = event.sequence if event.sequence is not None else -1; source_key = event.source or ""; key = (event.timestamp_ns, sequence_key, source_key, event.event_type.value)\n            if previous_key is not None and key < previous_key: raise ValueError("events must be ordered by timestamp, sequence, source, and type")',
              'sequence_key = event.sequence if event.sequence is not None else -1; source_key = event.source or ""; key = (event.timestamp_ns, sequence_key, source_key, event.event_type.value, event.instrument)\n            if previous_key is not None and key <= previous_key: raise ValueError("events must be strictly ordered by timestamp, sequence, source, type, and instrument; duplicate event identity is not allowed")',
          )

          # #94: depth-update replay must never move backwards in time.
          replace(
              "backend/app/backtesting/execution.py",
              '        fills: list[SimFill] = []\n        for timestamp_ns, book, evidence in updates:\n',
              '        fills: list[SimFill] = []\n        previous_timestamp_ns: int | None = None\n        for timestamp_ns, book, evidence in updates:\n',
          )
          replace(
              "backend/app/backtesting/execution.py",
              '            timestamp_ns = self._timestamp(timestamp_ns, "timestamp_ns")\n            if remaining <= 0:\n',
              '            timestamp_ns = self._timestamp(timestamp_ns, "timestamp_ns")\n            if previous_timestamp_ns is not None and timestamp_ns <= previous_timestamp_ns:\n                raise ValueError("depth updates must be strictly ordered by timestamp_ns")\n            previous_timestamp_ns = timestamp_ns\n            if remaining <= 0:\n',
          )

          # Strict strategy quantity validation: never truncate 1.9/True into a valid order.
          for path in [
              "backend/app/backtesting/high_resolution_streaming.py",
              "backend/app/backtesting/resumable_high_resolution.py",
              "backend/app/backtesting/resumable_high_resolution_v2.py",
          ]:
              p = Path(path)
              s = p.read_text()
              old = '        quantity = int(getattr(signal, "quantity", signal.get("quantity") if isinstance(signal, dict) else 0))\n'
              new = '        raw_quantity = getattr(signal, "quantity", signal.get("quantity") if isinstance(signal, dict) else 0)\n        if isinstance(raw_quantity, bool) or not isinstance(raw_quantity, int):\n            raise ValueError("invalid strategy signal quantity")\n        quantity = raw_quantity\n'
              if old in s:
                  s = s.replace(old, new, 1)
              else:
                  old = '        quantity = int(getattr(signal, "quantity", signal.get("quantity") if isinstance(signal, dict) else 0))\n'
                  if old not in s:
                      raise SystemExit(f"quantity pattern missing in {path}")
              p.write_text(s)

          # #96: resumed high-resolution results must retain cumulative signal count.
          p = Path("backend/app/backtesting/resumable_high_resolution.py")
          s = p.read_text()
          s = s.replace(
              '        signals = 0\n        batch_events = 0\n',
              '        signals = 0\n        if checkpoint is not None:\n            signals = int(checkpoint.state.get("signals", 0)) if isinstance(checkpoint.state, dict) else 0\n        batch_events = 0\n', 1)
          s = s.replace(
              '{"strategy": self._strategy_state(strategy), "positions": self.positions.snapshot_state()},\n',
              '{"strategy": self._strategy_state(strategy), "positions": self.positions.snapshot_state(), "signals": signals},\n', 1)
          p.write_text(s)

          # #95/#97: v2 runner must restore cumulative signal count and reject bool/fractional quantities.
          p = Path("backend/app/backtesting/resumable_high_resolution_v2.py")
          s = p.read_text()
          s = s.replace(
              '        signals = 0\n        for event in ordered_events(events):\n',
              '        signals = 0\n        if checkpoint is not None:\n            signals = int(checkpoint.state.get("signals", 0)) if isinstance(checkpoint.state, dict) else 0\n        for event in ordered_events(events):\n', 1)
          s = s.replace(
              '                self.run_id, event.timestamp_ns, event.sequence,\n                processed, self.positions.net_pnl, self._snapshot(strategy)))\n',
              '                self.run_id, event.timestamp_ns, event.sequence,\n                processed, self.positions.net_pnl, {**self._snapshot(strategy), "signals": signals}))\n', 1)
          p.write_text(s)

          # Add regression tests in a single focused file.
          test = Path("backend/app/backtesting/tests/test_batch_91_100_regressions.py")
          test.write_text('''from app.backtesting.engine import BacktestConfig, BacktestEngine, EventSignal\nfrom app.backtesting.historical_catalog import HistoricalRecord\nfrom app.backtesting.execution import ExecutionSimulator, SimOrder, ExecutionSide, OrderBook, DepthLevel\nfrom app.backtesting.high_resolution_streaming import HighResolutionStreamingRunner\n\ndef rec(ts, seq, price):\n    return HistoricalRecord(source="test", instrument="X", timeframe="tick", timestamp_ns=ts, payload={"price": price}, sequence=seq)\n\ndef test_event_hold_updates_final_mark_and_duplicate_is_rejected():\n    engine = BacktestEngine(BacktestConfig(quantity=1))\n    events = [rec(1, 1, 100), rec(2, 2, 110), rec(3, 3, 90)]\n    def strategy(ctx):\n        return EventSignal("BUY") if ctx.timestamp_ns == 1 else EventSignal("HOLD")\n    result = engine.run_events(events, strategy)\n    assert result.has_open_trade and result.unrealized_pnl == -10\n    try:\n        engine.run_events([rec(1, 1, 100), rec(1, 1, 101)], lambda _: EventSignal("HOLD"))\n    except ValueError as exc:\n        assert "duplicate" in str(exc)\n    else:\n        raise AssertionError("duplicate event identity was accepted")\n\ndef test_depth_updates_reject_backwards_time():\n    sim = ExecutionSimulator()\n    order = SimOrder("o", "X", ExecutionSide.BUY, 1)\n    book = OrderBook(asks=(DepthLevel(100, 1),))\n    try:\n        sim.execute_depth_updates(order, [(2, book, ()), (1, book, ())])\n    except ValueError as exc:\n        assert "ordered" in str(exc)\n    else:\n        raise AssertionError("out-of-order depth updates were accepted")\n\ndef test_high_resolution_rejects_fractional_quantity():\n    class Bad: side = "BUY"; quantity = 1.5\n    from app.backtesting.universal import MarketEvent\n    event = MarketEvent(1, "X", "trade", {"price": 100}, 1)\n    try:\n        HighResolutionStreamingRunner._fill_from_signal(Bad(), event)\n    except ValueError as exc:\n        assert "quantity" in str(exc)\n    else:\n        raise AssertionError("fractional quantity was silently truncated")\n''')

          import subprocess
          subprocess.run(["git", "config", "user.name", "github-actions[bot]"], check=True)
          subprocess.run(["git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com"], check=True)
          subprocess.run(["git", "add", "backend/app/backtesting", ".github/workflows/_batch_91_100_fix.yml"], check=True)
          subprocess.run(["git", "commit", "-m", "fix: batch 91-100 backtest execution regressions"], check=True)
          subprocess.run(["git", "push", "origin", "fix/batch-45-50"], check=True)
