name: VPS Health Probe

on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/vps-health-probe.yml
  schedule:
    # India cash-market observation window: 09:15-15:30 IST (03:45-10:00 UTC).
    - cron: "*/5 3-9 * * 1-5"
    - cron: "0 10 * * 1-5"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check VPS deployment state
        env:
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: 82.41.67.22
        run: |
          set -u -o pipefail
          printf '%s' "$VPS_KEY" | base64 --decode > /tmp/vps_key
          chmod 600 /tmp/vps_key
          mkdir -p ~/.ssh
          ssh-keyscan -H "$VPS_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i /tmp/vps_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=10 "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE' | tee /tmp/vps-health-probe.txt
          set -u
          echo "=== HOST ==="
          echo "HOST=$(hostname)"
          echo "USER=$(id -un)"

          echo "=== APP DIR ==="
          if [ -d /opt/Algo-Trading/.git ]; then
            echo "APP_DIR_OK"
            echo "COMMIT=$(git -C /opt/Algo-Trading rev-parse --short HEAD 2>/dev/null || true)"
            git -C /opt/Algo-Trading status --short --branch 2>/dev/null || true
          else
            echo "APP_DIR_MISSING"
          fi

          echo "=== ENV ==="
          if [ -f /opt/Algo-Trading/backend/.env ]; then
            echo "ENV_OK"
          else
            echo "ENV_MISSING"
          fi

          echo "=== RUNTIME SNAPSHOT ==="
          common_code=$(curl -sS --connect-timeout 2 --max-time 8 -o /tmp/common_body -w "%{http_code}" http://127.0.0.1:8000/api/v1/market-data/common-feed-health 2>/dev/null || true)
          echo "COMMON_FEED_HEALTH_HTTP=$common_code"
          if [ "$common_code" != "000" ]; then
            cat /tmp/common_body || true
            echo
          fi

          runtime_code=$(curl -sS --connect-timeout 2 --max-time 8 -o /tmp/runtime_body -w "%{http_code}" http://127.0.0.1:8000/api/v1/market-data/runtime/health 2>/dev/null || true)
          echo "RUNTIME_HEALTH_HTTP=$runtime_code"
          if [ "$runtime_code" != "000" ]; then
            cat /tmp/runtime_body || true
            echo
          fi

          live_health_code=$(curl -sS --connect-timeout 2 --max-time 8 -o /tmp/live_health_body -w "%{http_code}" http://127.0.0.1:8000/api/v1/market-data/live-health 2>/dev/null || true)
          echo "LIVE_HEALTH_HTTP=$live_health_code"
          if [ "$live_health_code" != "000" ]; then
            cat /tmp/live_health_body || true
            echo
          fi

          echo "=== LIVE SCANNER SNAPSHOTS ==="
          for endpoint in \
            "/api/v1/scanner/cash-future/live/fast?max_age_seconds=5&limit=5" \
            "/api/v1/scanner/calendar-spread/live?limit=5" \
            "/api/v1/scanner/synthetic-cash-carry/live?limit=5" \
            "/api/v1/scanner/box-spread/live?limit=5"; do
                        safe_name=$(printf '%s' "$endpoint" | tr '\/?=&' '____')
            code=$(curl -sS --connect-timeout 2 --max-time 8 -o "/tmp/scanner_$safe_name" -w "%{http_code}" "http://127.0.0.1:8000$endpoint" 2>/dev/null || true)
            echo "SCANNER_ENDPOINT=$endpoint HTTP=$code"
            if [ "$code" != "000" ]; then
              head -c 6000 "/tmp/scanner_$safe_name" || true
              echo
            fi
          done

          echo "=== SYNTHETIC FEED ACCEPTANCE ==="
          synthetic_code=$(curl -sS --connect-timeout 2 --max-time 8 -o /tmp/synthetic_diag_body -w "%{http_code}" http://127.0.0.1:8000/api/v1/scanner/synthetic-cash-carry/diagnostics 2>/dev/null || true)
          echo "SYNTHETIC_DIAGNOSTICS_HTTP=$synthetic_code"
          if [ "$synthetic_code" != "000" ]; then
            cat /tmp/synthetic_diag_body || true
            echo
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path

          def load(path):
              try:
                  return json.loads(Path(path).read_text())
              except Exception:
                  return {}

          def walk(value):
              if isinstance(value, dict):
                  yield value
                  for child in value.values():
                      yield from walk(child)
              elif isinstance(value, list):
                  for child in value:
                      yield from walk(child)

          diag = load("/tmp/synthetic_diag_body")
          runtime = load("/tmp/runtime_body")
          live_health = load("/tmp/live_health_body")
          nodes = list(walk(runtime)) + list(walk(live_health))
          session = next((str(x.get("market_session", "")).upper() for x in nodes if x.get("market_session")), "")
          feed = diag.get("underlying_feed") if isinstance(diag.get("underlying_feed"), dict) else {}
          symbols = feed.get("symbols") if isinstance(feed.get("symbols"), dict) else {}
          resolved = [name for name, item in symbols.items() if isinstance(item, dict) and item.get("token_resolved")]
          fresh_10s = [name for name, item in symbols.items() if isinstance(item, dict) and isinstance(item.get("last_tick_age_seconds"), (int, float)) and item["last_tick_age_seconds"] <= 10]
          fresh_5s = [name for name, item in symbols.items() if isinstance(item, dict) and isinstance(item.get("last_tick_age_seconds"), (int, float)) and item["last_tick_age_seconds"] <= 5]
          readiness = next((x for x in nodes if isinstance(x.get("ready_symbols"), list) and isinstance(x.get("waiting_symbols"), list)), {})
          ready_symbols = readiness.get("ready_symbols", [])
          initialized = bool(diag.get("scanner_initialized"))
          state = str(feed.get("state") or "NO_FEED_SNAPSHOT")
          reason = str(feed.get("state_reason") or "no_underlying_feed_snapshot")
          expected = max(len(symbols), int(diag.get("target_count") or 0))
          minimum_ready = max(1, (expected + 1) // 2)
          print(f"MARKET_SESSION={session or 'UNKNOWN'}")
          print(f"UNDERLYING_FEED_STATE={state}")
          print(f"UNDERLYING_FEED_REASON={reason}")
          print(f"TOKENS_RESOLVED={len(resolved)}/{len(symbols)}")
          print(f"FRESH_TICKS_LE_10S={len(fresh_10s)}/{len(symbols)}")
          print(f"FRESH_TICKS_LE_5S={len(fresh_5s)}/{len(symbols)}")
          print(f"ATM_READY_SYMBOLS={len(ready_symbols)}/{expected}")
          print(f"ATM_READY_MINIMUM_REQUIRED={minimum_ready}")
          print(f"SCANNER_INITIALIZED={initialized}")
          if session != "OPEN":
              print("ACCEPTANCE_RESULT=DEFERRED_MARKET_NOT_OPEN")
          else:
              checks = {
                  "token_resolution": bool(symbols) and len(resolved) == len(symbols),
                  "fresh_ticks_le_5s": bool(symbols) and len(fresh_5s) >= minimum_ready,
                  "atm_readiness": len(ready_symbols) >= minimum_ready,
                  "scanner_initialization": initialized,
              }
              for name, passed in checks.items():
                  print(f"GATE_{name.upper()}={'PASS' if passed else 'FAIL'}")
              print("ACCEPTANCE_RESULT=" + ("PASS" if all(checks.values()) else "FAIL"))
              if not all(checks.values()):
                  raise SystemExit(1)
          PY
          acceptance_status=$?

          echo "=== SERVICE MEMORY / PROCESS ==="
          systemctl show algo-trading.service --no-pager \
            -p ActiveState -p SubState -p Result -p NRestarts \
            -p ExecMainPID -p ExecMainStatus -p ActiveEnterTimestamp \
            -p InactiveEnterTimestamp -p MemoryCurrent -p MemoryPeak \
            -p OOMPolicy -p MemoryHigh -p MemoryMax || true
          pid=$(systemctl show -p MainPID --value algo-trading.service 2>/dev/null || true)
          if [ -n "$pid" ] && [ "$pid" != "0" ] && [ -r "/proc/$pid/status" ]; then
            echo "MAIN_PID=$pid"
            grep -E '^(VmRSS|VmHWM|VmSize|Threads):' "/proc/$pid/status" || true
          fi
          free -h || true
          echo "=== KERNEL OOM EVENTS ==="
          journalctl -k --no-pager -b 2>/dev/null |
            grep -Ei 'oom|out of memory|killed process|memory cgroup|systemd-oomd' |
            tail -40 || true

          echo "=== SERVICE TRANSACTIONS ==="
          journalctl -u algo-trading.service --since "20 minutes ago" --no-pager 2>/dev/null |
            grep -E 'Stopping|Stopped|Started|Starting|timeout|Failed|Main process exited|Killing|signal' |
            tail -80 || true

          echo "=== SERVICE ==="
          echo "ACTIVE=$(systemctl is-active algo-trading.service 2>/dev/null || true)"
          echo "ENABLED=$(systemctl is-enabled algo-trading.service 2>/dev/null || true)"
          systemctl cat algo-trading.service 2>/dev/null | grep -E '^(WorkingDirectory|ExecStart)=' || true

          echo "=== LOCAL HEALTH ==="
          code=$(curl -sS --connect-timeout 2 --max-time 5 -o /tmp/health_body -w "%{http_code}" http://127.0.0.1:8000/health 2>/dev/null || true)
          echo "HEALTH_HTTP=$code"
          if [ "$code" != "000" ]; then
            head -c 500 /tmp/health_body || true
            echo
          fi

          echo "=== LISTENING ==="
          ss -ltn 2>/dev/null | grep -E ':(80|443|8000|8080)\\b' || true
          exit "$acceptance_status"
          REMOTE

      - name: Upload VPS health evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: vps-health-evidence-${{ github.run_id }}
          path: /tmp/vps-health-probe.txt
          if-no-files-found: warn
          retention-days: 14
