name: Backend Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: backend-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-timeout

      - name: Clean old db files
        run: rm -f backend/*.db backend/*.sqlite* backend/app/*.db || true

      - name: Run backend tests
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          PYTHONPATH: backend
          DATABASE_URL: sqlite:///:memory:
          PYTHONUNBUFFERED: "1"
        run: |
          python -m pytest backend/tests -q --tb=short --timeout=60 --maxfail=20 -k "not durable and not streaming and not dashboard_route"