name: Backend Tests
on: [push, pull_request, workflow_dispatch]
concurrency:
  group: backend-tests
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r backend/requirements.txt pytest pytest-timeout

      - run: rm -f backend/*.db || true

      - name: Run backend tests
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          PYTHONPATH: backend
          DATABASE_URL: "sqlite:///:memory:"
        run: python -m pytest backend/tests -q --tb=no -r fE --timeout=60 --timeout-method=thread --maxfail=100
