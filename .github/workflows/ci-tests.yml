name: Backend Tests & Controlled Gemini Auto-Fixer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      PYTHONPATH: ..
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest requests

      - name: Compile backend
        run: python -m compileall -q app

      - name: Run tests
        id: run-tests
        continue-on-error: true
        run: |
          set +e
          python -m pytest --maxfail=1 -q 2>&1 | tee pytest_failure.log
          status=${PIPESTATUS[0]}
          echo "exit_code=$status" >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Gemini Controlled Auto-Fixer
        if: steps.run-tests.outcome == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${GEMINI_API_KEY:-}" ]; then
            echo "GEMINI_API_KEY is missing; no automatic code change will be made."
            exit 1
          fi

          cat > gemini_fixer.py <<'PY'
          import os, re, requests
          from pathlib import Path

          root = Path.cwd()
          failure = (root / "pytest_failure.log").read_text(errors="replace")[-30000:]
          files = []
          for p in sorted((root / "app").rglob("*.py")):
              if "__pycache__" not in p.parts:
                  files.append(f"<<< FILE: {p.relative_to(root).as_posix()} >>>\n{p.read_text(errors='replace')}\n<<< END >>>")
          snapshot = "\n".join(files)

          prompt = f'''You are a senior Python backend maintainer.
          Diagnose the REAL pytest failure below and make the smallest safe production-code fix.
          STRICT RULES:
          - Modify ONLY existing files under backend/app/ (the working directory is backend, so paths must begin app/).
          - NEVER modify tests, workflows, requirements, config, or generated files.
          - NEVER weaken/change assertions or expected values.
          - NEVER use fake data, constants, mocks, or special cases merely to pass the test.
          - Preserve existing Cash-Future/backtesting architecture, durable ledger behavior, resume/checkpoint safety, and JSON-safe API output.
          - No unrelated cleanup or refactoring.
          - Return COMPLETE contents only for files that genuinely need changes.
          - First output exactly: SUMMARY: <root cause and fix>
          - Then use exactly: <<< FILE: app/path.py >>> followed by complete code and <<< END >>>
          - No Markdown fences.

          TEST FAILURE:
          {failure}

          PRODUCTION SOURCE:
          {snapshot}'''

          url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-lite:generateContent"
          r = requests.post(
              url,
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": os.environ["GEMINI_API_KEY"],
              },
              json={"contents":[{"parts":[{"text":prompt}]}]},
              timeout=120,
          )
          if r.status_code >= 400:
              raise RuntimeError(f"Gemini API {r.status_code}: {r.text[:2000]}")
          body = r.json()
          text = body["candidates"][0]["content"]["parts"][0]["text"]

          m = re.search(r"^SUMMARY:\s*(.+)$", text, re.MULTILINE)
          (root / "gemini_summary.txt").write_text((m.group(1).strip() if m else "No summary returned.") + "\n")

          matches = re.findall(r"<<< FILE:\s*(.*?)\s*>>>\n(.*?)\n<<< END >>>", text, re.DOTALL)
          if not matches:
              raise RuntimeError("Gemini returned no valid file changes")
          for raw, code in matches:
              rel = raw.strip()
              if not rel.startswith("app/") or not rel.endswith(".py") or ".." in Path(rel).parts:
                  raise RuntimeError(f"Forbidden Gemini path: {rel}")
              target = root / rel
              if not target.exists():
                  raise RuntimeError(f"Gemini tried to create unknown file: {rel}")
              target.write_text(code.strip() + "\n")
          PY

          for attempt in 1 2; do
            echo "=== Controlled Gemini repair $attempt/2 ==="
            python gemini_fixer.py
            python -m compileall -q app
            set +e
            python -m pytest -q 2>&1 | tee "pytest_after_gemini_${attempt}.log"
            status=${PIPESTATUS[0]}
            set -e
            if [ "$status" -eq 0 ]; then
              echo "VERIFIED GREEN: full pytest suite passed."
              exit 0
            fi
            if [ "$attempt" -eq 1 ]; then
              echo "First repair failed verification; allowing one fresh diagnosis."
              cp "pytest_after_gemini_${attempt}.log" pytest_failure.log
            fi
          done
          echo "Gemini repair was NOT verified GREEN. No commit will be made."
          exit 1

      - name: PR failure report
        if: steps.run-tests.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: "### Backend Tests ❌\n\nTests failed. Automatic code changes are disabled for pull requests."
            })

      - name: Commit verified fix
        if: success() && steps.run-tests.outcome == 'failure' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git status --short
          if git status --short | grep -vE '^ M backend/app/|^?? backend/gemini_summary.txt$|^?? backend/pytest_' | grep .; then
            echo "Forbidden files changed; refusing to commit."
            exit 1
          fi
          rm -f gemini_fixer.py pytest_failure.log pytest_after_gemini_*.log gemini_summary.txt
          git config user.name 'Gemini-Auto-Bot'
          git config user.email 'gemini-bot@github.com'
          git add app/
          if git diff --cached --quiet; then
            echo "No production-code change to commit."
            exit 1
          fi
          git commit -m 'Fix: verified backend test failure'
          git push
