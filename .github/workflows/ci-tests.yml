name: Backend Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install pytest

      - name: Compile backend
        run: python -m compileall -q app

      - name: Run tests
        run: python -m pytest -q

# CI verification trigger for persistent paper balance and realized P&L coverage
# Incremental Full-F&O verification trigger: durable result sinking / bounded RAM
# Keyset result API verification trigger: cursor pagination without deep OFFSET scans
