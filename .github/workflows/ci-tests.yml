name: Backend Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r backend/requirements.txt pytest
      - name: Test
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q -k "not durable and not streaming"