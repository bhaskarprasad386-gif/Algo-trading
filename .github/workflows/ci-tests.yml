name: Backend Tests & Gemini Auto-Fixer

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      PYTHONPATH: ..
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt && pip install pytest requests

      - name: Compile backend
        run: python -m compileall -q app

      # 1. Backend Test execution
      - name: Run tests
        id: run-tests
        run: python -m pytest --maxfail=1 -q
        continue-on-error: true

      # 2. Gemini Pro Auto-Writer
      - name: Gemini Pro Auto-Writer
        if: steps.run-tests.outcome == 'failure'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "बैकएंड टेस्ट फेल हो गया है। Gemini Pro कोड को ऑटो-राइट कर रहा है..."
          python -c "
          import os, requests, json, glob, re

          api_key = os.getenv('GEMINI_API_KEY')
          if not api_key:
              print('Error: GEMINI_API_KEY nahi mili!')
              exit(1)

          python_files = glob.glob('**/*.py', recursive=True)
          code_snapshot = ''
          for f in python_files:
              if 'venv' not in f and '.github' not in f:
                  try:
                      with open(f, 'r') as file:
                          code_snapshot += f'\n<<< FILE: {f} >>>\n' + file.read() + '\n<<< END >>>\n'
                  except:
                      pass

          # Sahi Endpoint bina kisi external variable ke string me fix kar diya hai
          url = ''https://googleapis.com'' + api_key

          headers = {'Content-Type': 'application/json'}
          
          prompt = 'मेरा पायथन बैकएंड कोड फेल हो गया है। कोड में गलतियां सुधारो। मुझे रिस्पॉन्स में पहले एक छोटा summary दो कि क्या गलती थी SUMMARY block में, फिर सुधरा हुआ कोड इस फॉर्मेट में देना। कोई Markdown backticks (```python) मत लगाना:\n<<< FILE: file_path.py >>>\n[सुधरा हुआ कोड]\n<<< END >>>\n\nCode Snapshot:\n' + code_snapshot
          
          data = {'contents': [{'parts': [{'text': prompt}]}]}
          response = requests.post(url, headers=headers, json=data)
          
          try:
              res_json = response.json()
              ai_text = res_json['candidates']['content']['parts']['text']

              
              summary_match = re.search(r'SUMMARY:(.*?)(?:<<< FILE|$)', ai_text, re.DOTALL)
              summary_text = summary_match.group(1).strip() if summary_match else 'Gemini ne code fix kar diya hai.'
              with open('gemini_summary.txt', 'w') as sf:
                  sf.write(summary_text)

              matches = re.findall(r'<<< FILE: (.*?) >>>\n(.*?)<<< END >>>', ai_text, re.DOTALL)
              if matches:
                  for file_path, corrected_code in matches:
                      file_path = file_path.strip()
                      cleaned_code = re.sub(r'^```[a-zA-Z]*\n', '', corrected_code)
                      cleaned_code = re.sub(r'\n```$', '', cleaned_code)
                      
                      print(f'Updating file: {file_path}')
                      with open(file_path, 'w') as f:
                          f.write(cleaned_code.strip())
                  print('Gemini ne saari files successfully update kar di hain!')
              else:
                  print('AI output format galat tha ya koi badlav nahi mila.')
          except Exception as e:
              print('AI se response process karne me error:', e)
              print('Raw response body:', response.text)
          "

      # 3. PR par Comment post karna
      - name: Post Comment on PR
        if: steps.run-tests.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = 'Gemini AI ne errors fix karne ke liye code generate kar diya hai.';
            try {
              summary = fs.readFileSync('backend/gemini_summary.txt', 'utf8');
            } catch (err) {
              console.log('Summary file nahi mili');
            }
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### 🤖 Gemini Auto-Fixer Report\n\n**Test Status:** ❌ Failed\n\n**Gemini AI Feedback:**\n${summary}\n\n*Note: corrected code repository me push kar diya gaya hai.*`
            })

      # 4. Code Commit aur Push karna
      - name: Commit and Push Fixed Code
        if: steps.run-tests.outcome == 'failure'
        run: |
          git config --global user.name 'Gemini-Auto-Bot'
          git config --global user.email 'gemini-bot@github.com'
          git add ../backend/
          git diff --quiet --cached || (git commit -m "Fix: Gemini Auto-wrote code to fix backend test failure" && git push)
