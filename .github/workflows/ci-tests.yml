name: Backend Tests
on: [push, pull_request, workflow_dispatch]
concurrency:
  # Isolate runs per ref so unrelated PRs cannot cancel each other's backend gate.
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broker-fast:
    name: Fast Broker Safety Gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      PYTHONPATH: backend
      DATABASE_URL: "sqlite:///:memory:"
      LIVE_CASH_FUTURE_DATA_ENABLED: "false"
      LIVE_CALENDAR_SPREAD_DATA_ENABLED: "false"
      LIVE_SYNTHETIC_DATA_ENABLED: "false"
      LIVE_BOX_SPREAD_DATA_ENABLED: "false"
      LIVE_MARKET_DATA_PERSISTENCE_ENABLED: "false"
      LIVE_CASH_FUTURE_DAILY_SHARDS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          cache: pip
          cache-dependency-path: backend/requirements.txt
          python-version: "3.11"
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-timeout
      - name: Compile broker reconciliation modules
        run: |
          python -m py_compile backend/app/brokers/base.py
          python -m py_compile backend/app/brokers/angel_one.py
          python -m py_compile backend/app/brokers/mstock.py
          python -m py_compile backend/app/execution/broker_reconciliation.py
      - name: Run fast broker contract and fail-closed tests
        run: |
          python -m pytest -q --tb=short --timeout=20 --timeout-method=thread \
            backend/tests/test_broker_reconciliation.py \
            backend/tests/test_broker_safety_fail_closed.py \
            backend/tests/test_broker_connectivity.py \
            backend/tests/test_angel_one_readonly_history.py \
            backend/tests/test_mstock_readonly_history.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iv_basket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iv_basket_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          cache: pip
          cache-dependency-path: backend/requirements.txt
          python-version: "3.11"

      - run: pip install -r backend/requirements.txt pytest pytest-timeout "psycopg[binary]"

      - run: rm -f backend/*.db || true

      - name: Run backend tests
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          PYTHONPATH: backend
          DATABASE_URL: "sqlite:///:memory:"
          IV_TEST_POSTGRES_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/iv_basket_test"
          # CI must not start broker-backed live collectors; those are exercised by dedicated integration/runtime checks.
          LIVE_CASH_FUTURE_DATA_ENABLED: "false"
          LIVE_CALENDAR_SPREAD_DATA_ENABLED: "false"
          LIVE_SYNTHETIC_DATA_ENABLED: "false"
          LIVE_BOX_SPREAD_DATA_ENABLED: "false"
          LIVE_MARKET_DATA_PERSISTENCE_ENABLED: "false"
          LIVE_CASH_FUTURE_DAILY_SHARDS_ENABLED: "false"
        run: >-
          python -m pytest backend/tests -q --tb=short -r fE
          -k "not test_commodity_selection_is_dynamic_current_near_and_actual_strikes"
          --timeout=60 --timeout-method=thread --maxfail=100
          --ignore=backend/tests/test_angelone_cash_future_batch_runner_integration.py
          --ignore=backend/tests/test_universal_result_main_integration.py
          --ignore=backend/tests/test_cash_future_strategy_db_route.py
          --ignore=backend/tests/test_historical_arbitrage_catalog_e2e.py
          --ignore=backend/tests/test_historical_catalog_replay.py
          --ignore=backend/tests/test_historical_arbitrage_service.py
          --ignore=backend/tests/test_angelone_cash_future_batch_runner.py
          --ignore-glob='backend/tests/test_cash_future*.py'
          --ignore-glob='backend/tests/test_live_cash_future*.py'
          --ignore-glob='backend/tests/test_monthly_results_routes_cash_future.py'
          --ignore-glob='backend/tests/test_android_cash_future*.py'
          --ignore-glob='backend/tests/test_angelone_cash_future*.py'
