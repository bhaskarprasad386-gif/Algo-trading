name: Backend Tests
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r backend/requirements.txt pytest pytest-timeout
      - name: Test
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          PYTHONPATH: backend
          DATABASE_URL: sqlite:///:memory:
        run: python -m pytest backend/tests -q --tb=short --timeout=120 -k "not durable and not streaming and not dashboard_route"