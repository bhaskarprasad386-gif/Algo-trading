name: Backend Tests
on: [push, pull_request, workflow_dispatch]
concurrency:
  # Isolate runs per ref so unrelated PRs cannot cancel each other's backend gate.
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  broker-fast:
    name: Fast Broker Safety Gate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SECRET_KEY: ci-test-secret-key-not-for-production
      PYTHONPATH: backend
      DATABASE_URL: "sqlite:///:memory:"
      LIVE_MARKET_DATA_PERSISTENCE_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          cache: pip
          cache-dependency-path: backend/requirements.txt
          python-version: "3.11"
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-timeout
      - name: Compile broker reconciliation modules
        run: |
          python -m py_compile backend/app/brokers/base.py
          python -m py_compile backend/app/brokers/angel_one.py
          python -m py_compile backend/app/brokers/mstock.py
          python -m py_compile backend/app/execution/broker_reconciliation.py
      - name: Run fast broker contract and fail-closed tests
        run: |
          python -m pytest -q --tb=short --timeout=20 --timeout-method=thread \
            backend/tests/test_broker_reconciliation.py \
            backend/tests/test_broker_safety_fail_closed.py \
            backend/tests/test_broker_connectivity.py \
            backend/tests/test_angel_one_readonly_history.py \
            backend/tests/test_mstock_readonly_history.py

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: iv_basket_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d iv_basket_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          cache: pip
          cache-dependency-path: backend/requirements.txt
          python-version: "3.11"

      - run: pip install -r backend/requirements.txt pytest pytest-timeout "psycopg[binary]"

      - run: rm -f backend/*.db || true

      - name: Run backend tests
        env:
          SECRET_KEY: ci-test-secret-key-not-for-production
          PYTHONPATH: backend
          DATABASE_URL: "sqlite:///:memory:"
          IV_TEST_POSTGRES_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/iv_basket_test"
          # CI must not start broker-backed live collectors; those are exercised by dedicated integration/runtime checks.
          LIVE_MARKET_DATA_PERSISTENCE_ENABLED: "false"
        run: >-
          python -m pytest backend/tests -q --tb=short -r fE
          -k "not test_commodity_selection_is_dynamic_current_near_and_actual_strikes"
          --timeout=60 --timeout-method=thread --maxfail=100
          --ignore=backend/tests/test_universal_result_main_integration.py
          --ignore=backend/tests/test_historical_catalog_replay.py
          --ignore-glob='backend/tests/test_weekly_swing_scanner.py'
          --ignore-glob='backend/tests/test_weekly_swing_scheduler.py'
          --ignore-glob='backend/tests/test_dual_execution.py'
          --ignore-glob='backend/tests/test_execution_queue_dynamic*.py'
          --ignore-glob='backend/tests/test_backtest*.py'
          --ignore-glob='backend/tests/test_backtesting*.py'
          --ignore-glob='backend/tests/test_durable_backtest_job.py'
          --ignore-glob='backend/tests/test_resumable_backtest.py'
          --ignore-glob='backend/tests/test_broker_event_replay_review.py'
          --ignore-glob='backend/tests/test_broker_replay_eligibility_audit_guards.py'
          --ignore-glob='backend/tests/test_continuous_futures_catalog_replay.py'
          --ignore-glob='backend/tests/test_dashboard_batch10_historical_replay.py'
          --ignore-glob='backend/tests/test_durable_replay_resume_equivalence.py'
          --ignore-glob='backend/tests/test_high_resolution_conflicting_replay.py'
         
          --ignore-glob='backend/tests/test_historical_catalog_replay.py'
          --ignore-glob='backend/tests/test_incremental_backtest*.py'
          --ignore-glob='backend/tests/test_persisted_symbol_replay.py'
          --ignore-glob='backend/tests/test_broker_connectivity.py'
          --ignore-glob='backend/tests/test_broker_session_store.py'
          --ignore-glob='backend/tests/test_fyers_auth.py'
          --ignore-glob='backend/tests/test_shoonya_auth.py'
          --ignore-glob='backend/tests/test_zerodha_auth.py'
