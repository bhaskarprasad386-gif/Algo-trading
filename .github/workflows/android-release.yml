name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode
        required: true
        type: string
      version_name:
        description: Android versionName, e.g. 1.1
        required: true
        type: string
      release_notes:
        description: Release notes
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2'
      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > release.keystore
      - name: Build signed release APK
        env:
          BACKEND_BASE_URL: https://algo-trading-backend-2.onrender.com/
          BACKEND_WS_URL: wss://algo-trading-backend-2.onrender.com
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease --no-daemon \
            -PappVersionCode='${{ inputs.version_code }}' \
            -PappVersionName='${{ inputs.version_name }}' \
            -PbackendBaseUrl="$BACKEND_BASE_URL" \
            -PbackendWsUrl="$BACKEND_WS_URL" \
            -PandroidKeystorePath="$PWD/release.keystore" \
            -PandroidKeystorePassword="$KEYSTORE_PASSWORD" \
            -PandroidKeyAlias="$KEY_ALIAS" \
            -PandroidKeyPassword="$KEY_PASSWORD"
      - name: Rename release APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/algo-trading-release.apk
      - name: Publish GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v${{ inputs.version_name }}" \
            mobile/android/app/build/outputs/apk/release/algo-trading-release.apk \
            --title "Android v${{ inputs.version_name }}" \
            --notes "${{ inputs.release_notes }}"
      - name: Publish update manifest
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA256=$(sha256sum mobile/android/app/build/outputs/apk/release/algo-trading-release.apk | awk '{print $1}')
          cat > backend/app/app_update_manifest.json <<EOF
          {
            "platform": "android",
            "version_code": ${{ inputs.version_code }},
            "version_name": "${{ inputs.version_name }}",
            "release_notes": "${{ inputs.release_notes }}",
            "apk_url": "https://github.com/bhaskarprasad386-gif/Algo-trading/releases/latest/download/algo-trading-release.apk",
            "sha256": "$SHA256",
            "mandatory": false
          }
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/app_update_manifest.json
          git commit -m "chore(android): publish update manifest v${{ inputs.version_name }}" || exit 0
          git push origin main
      - name: Remove signing key
        if: always()
        run: rm -f release.keystore