name: Android Release

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: Android versionCode (must be greater than the currently released APK)
        required: false
        default: '5'
        type: string
      version_name:
        description: Android versionName, e.g. 1.1
        required: false
        default: '1.5'
        type: string
      release_notes:
        description: Release notes
        required: false
        default: 'Fix Android update versionCode so v1.3 installs as an update.'
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.2'

      - name: Validate Android signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_B64" || { echo "::error::ANDROID_KEYSTORE_BASE64 is missing"; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "::error::ANDROID_KEYSTORE_PASSWORD is missing"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::ANDROID_KEY_ALIAS is missing"; exit 1; }
          printf '%s' "$KEYSTORE_B64" | base64 --decode > release.keystore
          keytool -list -keystore release.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

          cat > ValidateSigningKey.java <<'JAVA'
          import java.io.FileInputStream;
          import java.security.Key;
          import java.security.KeyStore;

          public final class ValidateSigningKey {
              private static boolean privateKeyWorks(KeyStore ks, String alias, char[] password) {
                  try {
                      Key key = ks.getKey(alias, password);
                      return key instanceof java.security.PrivateKey;
                  } catch (Exception ignored) {
                      return false;
                  }
              }

              public static void main(String[] args) throws Exception {
                  String path = args[0];
                  char[] storePassword = args[1].toCharArray();
                  String alias = args[2];
                  String suppliedKeyPassword = args[3];

                  for (String type : new String[]{"JKS", "PKCS12"}) {
                      try (FileInputStream in = new FileInputStream(path)) {
                          KeyStore ks = KeyStore.getInstance(type);
                          ks.load(in, storePassword);

                          if (!suppliedKeyPassword.isEmpty()
                                  && privateKeyWorks(ks, alias, suppliedKeyPassword.toCharArray())) {
                              System.out.println("SECRET");
                              return;
                          }

                          if (privateKeyWorks(ks, alias, storePassword)) {
                              System.out.println("STORE");
                              return;
                          }
                      } catch (Exception ignored) {
                          // Try the other supported keystore type.
                      }
                  }

                  throw new IllegalStateException(
                      "Unable to decrypt the signing private key with either " +
                      "ANDROID_KEY_PASSWORD or ANDROID_KEYSTORE_PASSWORD. " +
                      "The existing GitHub secrets do not match the private-key password."
                  );
              }
          }
          JAVA

          javac ValidateSigningKey.java
          PASSWORD_SOURCE=$(java ValidateSigningKey release.keystore "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD")

          case "$PASSWORD_SOURCE" in
            SECRET)
              echo "ANDROID_KEY_PASSWORD_SOURCE=SECRET" >> "$GITHUB_ENV"
              echo "Android signing private-key validation passed."
              ;;
            STORE)
              echo "ANDROID_KEY_PASSWORD_SOURCE=STORE" >> "$GITHUB_ENV"
              echo "::warning::Private key is unlocked by the keystore password; Gradle will use the keystore password for the key password."
              ;;
            *)
              echo "::error::Unexpected signing-key validation result"
              exit 1
              ;;
          esac

          rm -f ValidateSigningKey.java ValidateSigningKey.class

      - name: Decode signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: printf '%s' "$KEYSTORE_B64" | base64 --decode > release.keystore

      - name: Validate release versionCode
        run: |
          test '${{ inputs.version_code }}' -gt 4 || { echo "::error::Android versionCode must be greater than v1.3 versionCode 4"; exit 1; }

      - name: Build signed release APK
        env:
          BACKEND_BASE_URL: https://algo-trading-backend-2.onrender.com/
          BACKEND_WS_URL: wss://algo-trading-backend-2.onrender.com
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "$ANDROID_KEY_PASSWORD_SOURCE" = "STORE" ]; then
            SIGNING_KEY_PASSWORD="$KEYSTORE_PASSWORD"
          else
            SIGNING_KEY_PASSWORD="$KEY_PASSWORD"
          fi

          gradle assembleRelease --no-daemon             -PappVersionCode='${{ inputs.version_code }}'             -PappVersionName='${{ inputs.version_name }}'             -PbackendBaseUrl="$BACKEND_BASE_URL"             -PbackendWsUrl="$BACKEND_WS_URL"             -PandroidKeystorePath="$PWD/release.keystore"             -PandroidKeystorePassword="$KEYSTORE_PASSWORD"             -PandroidKeyAlias="$KEY_ALIAS"             -PandroidKeyPassword="$SIGNING_KEY_PASSWORD"

      - name: Rename release APK
        run: cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/algo-trading-release.apk

      - name: Publish GitHub release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-v${{ inputs.version_name }}"             mobile/android/app/build/outputs/apk/release/algo-trading-release.apk             --title "Android v${{ inputs.version_name }}"             --notes "${{ inputs.release_notes }}"

      - name: Publish update manifest
        working-directory: .
        env:
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
          RELEASE_NOTES: ${{ inputs.release_notes }}
        run: |
          export SHA256=$(sha256sum mobile/android/app/build/outputs/apk/release/algo-trading-release.apk | awk '{print $1}')
          python - <<'PY'
          import json, os
          payload = {
              "platform": "android",
              "version_code": int(os.environ["VERSION_CODE"]),
              "version_name": os.environ["VERSION_NAME"],
              "release_notes": os.environ["RELEASE_NOTES"],
              "apk_url": "https://github.com/bhaskarprasad386-gif/Algo-trading/releases/latest/download/algo-trading-release.apk",
              "sha256": os.environ["SHA256"],
              "mandatory": False,
          }
          with open("backend/app/app_update_manifest.json", "w", encoding="utf-8") as f:
              json.dump(payload, f, indent=2)
              f.write("\n")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/app/app_update_manifest.json
          git commit -m "chore(android): publish update manifest v${{ inputs.version_name }}" || exit 0
          git push origin main

      - name: Remove signing key
        if: always()
        run: rm -f release.keystore
