name: VPS Read-Only Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/vps-readonly-diagnostic.yml'

concurrency:
  group: vps-readonly-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Read-only VPS diagnostic
        env:
          VPS_KEY_B64: ${{ secrets.VPS_SSH_KEY }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
        run: |
          set -euo pipefail
          test -n "$VPS_KEY_B64"
          test -n "$VPS_HOST"
          test -n "$VPS_USER"
          printf '%s' "$VPS_KEY_B64" | base64 --decode > /tmp/vps_key
          chmod 600 /tmp/vps_key
          SSH_KNOWN_HOSTS=/tmp/vps_known_hosts
          : > "$SSH_KNOWN_HOSTS"
          ssh-keyscan -T 10 -H "$VPS_HOST" > "$SSH_KNOWN_HOSTS"
          test -s "$SSH_KNOWN_HOSTS"
          SSH_OPTS=(-i /tmp/vps_key -o IdentitiesOnly=yes -o BatchMode=yes -o ConnectTimeout=15 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o UserKnownHostsFile="$SSH_KNOWN_HOSTS" -o StrictHostKeyChecking=yes)
          echo "=== SSH_PRECHECK ==="
          set +e
          ssh "${SSH_OPTS[@]}" "$VPS_USER@$VPS_HOST" 'printf "SSH_OK\\n"'
          PRECHECK_RC=$?
          set -e
          echo "SSH_PRECHECK_RC=$PRECHECK_RC"
          echo "=== STARTUP_SETTLE_WAIT ==="
          # Capture a settled, read-only post-restart snapshot; never restart or mutate runtime state here.
          # Let market-data auth, instrument-master loading, and scanner supervisors finish after a VPS restart.
          sleep 35
          echo "=== SSH_DIAGNOSTIC ==="
          set +e
          ssh "${SSH_OPTS[@]}" "$VPS_USER@$VPS_HOST" 'bash -s' <<'REMOTE_SCRIPT'
          set -u
          APP_DIR=/opt/Algo-Trading
          ENV_FILE="$APP_DIR/backend/.env"
          echo "REMOTE_SHELL_OK"
          echo "=== STRATEGY_FLAGS (values only; no credentials printed) ==="
          for key in LIVE_CASH_FUTURE_DATA_ENABLED LIVE_CALENDAR_SPREAD_DATA_ENABLED LIVE_BOX_SPREAD_DATA_ENABLED LIVE_SYNTHETIC_DATA_ENABLED LIVE_MARKET_DATA_PERSISTENCE_ENABLED; do
            value=$(grep -E "^${key}=" "$ENV_FILE" 2>/dev/null | tail -n 1 | cut -d= -f2- || true)
            if [ -z "$value" ]; then
              case "$key" in
                LIVE_SYNTHETIC_DATA_ENABLED) value="unset (code default true)" ;;
                *) value="unset (check code default)" ;;
              esac
            fi
            echo "$key=$value"
          done
          echo "=== DNS ==="
          getent hosts apiconnect.angelone.in || true
          echo "=== RESOLVER ==="
          resolvectl status 2>/dev/null | sed -n '1,100p' || cat /etc/resolv.conf
          echo "=== ANGEL_HTTPS ==="
          curl -I --connect-timeout 5 --max-time 12 https://apiconnect.angelone.in 2>&1 | head -40 || true
          echo "=== SERVICE ==="
          systemctl show algo-trading.service -p MainPID -p ActiveState -p SubState -p NRestarts -p MemoryCurrent -p MemoryPeak -p OOMPolicy -p MemoryMax
          echo "=== HEALTH ==="
          curl --fail --silent --show-error --connect-timeout 2 --max-time 8 http://127.0.0.1:8000/health || true
          echo
          echo "=== LIVE_HEALTH ==="
          curl --fail --silent --show-error --connect-timeout 2 --max-time 8 http://127.0.0.1:8000/api/v1/market-data/live-health || true
          echo
          echo "=== SYNTHETIC_DIAGNOSTICS ==="
          curl --fail --silent --show-error --connect-timeout 2 --max-time 12 http://127.0.0.1:8000/api/v1/scanner/synthetic-cash-carry/diagnostics || true
          echo
          echo "=== SYNTHETIC_PAIRS ==="
          curl --fail --silent --show-error --connect-timeout 2 --max-time 12 "http://127.0.0.1:8000/api/v1/scanner/synthetic-cash-carry/pairs?limit=50" || true
          echo
          echo "=== SYNTHETIC_RUNNER_LOGS ==="
          journalctl -u algo-trading.service --since "30 minutes ago" --no-pager 2>/dev/null | grep -Ei "synthetic|WAITING_FOR_ATM|monthly_expiry_unresolved|selector_returned_no_contracts|contract_selection_failed|concrete option strikes|underlying feed|subscription" | tail -160 || true
          echo
          echo "=== COMMON_FEED_HEALTH ==="
          curl --fail --silent --show-error --connect-timeout 2 --max-time 8 http://127.0.0.1:8000/api/v1/market-data/common-feed-health || true
          echo
          echo "=== SCANNER_LIVE_FAST ==="
          curl --fail --silent --show-error --connect-timeout 2 --max-time 12 "http://127.0.0.1:8000/api/v1/scanner/cash-future/live/fast?limit=20" || true
          echo
          echo "=== LIVE_CASH_FUTURE_HEALTH ==="
          curl --fail --silent --show-error --connect-timeout 2 --max-time 12 http://127.0.0.1:8000/api/v1/market-data/live-cash-future/health || true
          echo
          echo "=== RECENT_ANGEL_WS_LOGS ==="
          journalctl -u algo-trading.service --since "30 minutes ago" --no-pager 2>/dev/null | grep -Ei "angel|websocket|dns|name resolution|login failed|connect_fail|temporary failure" | tail -120 || true
          echo "=== TIME ==="
          TZ=Asia/Kolkata date
          echo "=== UPTIME_MEMORY ==="
          uptime
          free -h
          REMOTE_SCRIPT
          REMOTE_RC=$?
          set -e
          echo "REMOTE_DIAGNOSTIC_RC=$REMOTE_RC"
          test "$REMOTE_RC" -eq 0
