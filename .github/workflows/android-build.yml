name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      backend_base_url:
        description: 'Backend HTTP base URL (must end with /)'
        required: false
        default: 'http://10.0.2.2:8000/'
        type: string
      backend_ws_url:
        description: 'Backend WebSocket URL'
        required: false
        default: 'ws://10.0.2.2:8000'
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2'

      - name: Compile Android debug build
        env:
          BACKEND_BASE_URL: ${{ github.event.inputs.backend_base_url || 'http://10.0.2.2:8000/' }}
          BACKEND_WS_URL: ${{ github.event.inputs.backend_ws_url || 'ws://10.0.2.2:8000' }}
        run: |
          gradle assembleDebug --no-daemon \
            -PbackendBaseUrl="$BACKEND_BASE_URL" \
            -PbackendWsUrl="$BACKEND_WS_URL"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: algo-trading-debug-apk
          path: mobile/android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
