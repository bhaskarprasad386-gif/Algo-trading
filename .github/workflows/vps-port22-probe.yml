name: VPS Port 22 Probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Test correct VPS SSH endpoint
        env:
          VPS_HOST: 82.41.67.22
        run: |
          set -u

          echo "=== VPS IP ==="
          echo "$VPS_HOST"

          echo "=== TCP 22 ==="
          if timeout 10 bash -c "</dev/tcp/$VPS_HOST/22"; then
            echo "TCP_22_REACHABLE=true"
          else
            echo "TCP_22_REACHABLE=false"
            exit 1
          fi
