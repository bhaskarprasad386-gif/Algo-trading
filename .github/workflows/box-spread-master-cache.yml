name: Box Spread Instrument Master Cache
on:
  # Independent egress refresh; 00:00 UTC is 05:30 IST.
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - "backend/app/market_data/box_spread_instrument_cache.py"
      - "backend/app/market_data/master_transport.py"
      - ".github/workflows/box-spread-master-cache.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/market_data/box_spread_instrument_cache.py"
      - ".github/workflows/box-spread-master-cache.yml"

permissions:
  contents: read

jobs:
  build-box-spread-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - name: Fetch, validate and write isolated Box Spread cache
        working-directory: backend
        env:
          PYTHONPATH: .
          BOX_SPREAD_INSTRUMENT_MASTER_CACHE_PATH: ${{ runner.temp }}/box_spread_instrument_master_cache.json
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from app.market_data import box_spread_instrument_cache as cache
          from app.market_data.master_transport import download_master_rows

          errors = []
          rows = None
          sources = (
              ("primary", "https://margincalculator.angelbroking.com/OpenAPI_File/files/OpenAPIScripMaster.json"),
              ("alternate", cache.ALTERNATE_MASTER_URL),
          )
          for label, url in sources:
              try:
                  payload = download_master_rows(url, timeout=(5, 30), retries=3)
                  rows = cache._validated_rows(payload)
                  if rows is None:
                      raise ValueError("production Box Spread row validation failed")
                  print(f"{label}_download_validation=PASS rows={len(rows)}")
                  break
              except Exception as exc:
                  errors.append(f"{label}: {type(exc).__name__}: {exc}")
                  print(errors[-1])
          if rows is None:
              raise SystemExit("No official Angel One master passed validation: " + " | ".join(errors))
          cache._write_cache(rows)
          installed = cache._read_cache()
          if installed is None or cache._canonical_rows_digest(installed[0]) != cache._canonical_rows_digest(rows):
              raise SystemExit("Box Spread cache read-back verification failed")
          path = Path(os.environ["BOX_SPREAD_INSTRUMENT_MASTER_CACHE_PATH"])
          print(f"box_cache_path={path} rows={len(rows)} sha256={cache._canonical_rows_digest(rows)}")
          PY
      - name: Upload validated Box Spread-only cache
        uses: actions/upload-artifact@v4
        with:
          name: box-spread-instrument-master-validated
          path: ${{ runner.temp }}/box_spread_instrument_master_cache.json
          if-no-files-found: error
          retention-days: 14
